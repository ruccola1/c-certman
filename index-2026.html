    <script>
        // ===== SOUND MANAGER (Web Audio API) =====
        class SoundManager {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.initialized = false;
                this.muted = false;
                this.jinglePlaying = false;
                this.jingleTimeout = null;
                this.currentTrack = null;
            }

            init() {
                if (this.initialized) {
                    this.resume();
                    return;
                }
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.connect(this.ctx.destination);
                    this.initialized = true;
                    this.resume();
                } catch (e) {
                    console.warn('Web Audio not supported');
                }
            }

            // Browsers create AudioContext suspended until a user gesture
            resume() {
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            setMuted(muted) {
                this.muted = muted;
                if (this.masterGain) {
                    this.masterGain.gain.setValueAtTime(muted ? 0 : 1, this.ctx.currentTime);
                }
                if (muted) {
                    this.stopJingle(true);
                } else if (this.currentTrack === 'fanfare') {
                    this.playFanfare();
                } else if (this.currentTrack === 'hero') {
                    this.playSpaceHero();
                }
            }

            // Play a note with given frequency, duration, and waveform
            playTone(freq, duration, type = 'square', volume = 0.3, delay = 0) {
                if (!this.initialized || this.muted) return;
                this.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(volume, this.ctx.currentTime + delay);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + delay + duration);
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start(this.ctx.currentTime + delay);
                osc.stop(this.ctx.currentTime + delay + duration);
            }

            // Stop the looping jingle
            stopJingle(keepTrack = false) {
                this.jinglePlaying = false;
                if (!keepTrack) {
                    this.currentTrack = null;
                }
                if (this.jingleTimeout) {
                    clearTimeout(this.jingleTimeout);
                    this.jingleTimeout = null;
                }
            }

            // 80s Sci-Fi Hero Theme - Automan/Star Wars/Knight Rider style
            playSpaceHero() {
                if (!this.initialized || this.muted) {
                    // Remember what should be playing so init/unmute can resume it
                    this.currentTrack = 'hero';
                    return;
                }
                // Don't restart if already playing
                if (this.currentTrack === 'hero' && this.jinglePlaying) return;
                this.stopJingle();
                this.currentTrack = 'hero';
                this.jinglePlaying = true;

                const playLoop = () => {
                    if (!this.jinglePlaying || this.muted) return;

                    // Tempo: 140 BPM, 1/8 note = 0.214s
                    const eighth = 0.214;

                    // Electronic kick drum
                    const playKick = (time) => {
                        this.playTone(150, 0.08, 'sine', 0.35, time);
                        this.playTone(50, 0.15, 'sine', 0.3, time);
                    };

                    // Snare/clap
                    const playSnare = (time) => {
                        this.playTone(200, 0.05, 'square', 0.15, time);
                        for (let i = 0; i < 5; i++) {
                            this.playTone(800 + Math.random() * 600, 0.08, 'sawtooth', 0.04, time + i * 0.005);
                        }
                    };

                    // Hi-hat
                    const playHat = (time, open = false) => {
                        const dur = open ? 0.12 : 0.04;
                        for (let i = 0; i < 3; i++) {
                            this.playTone(8000 + Math.random() * 4000, dur, 'sawtooth', 0.02, time);
                        }
                    };

                    // Synth bass
                    const playBass = (freq, time) => {
                        this.playTone(freq, eighth * 0.9, 'sawtooth', 0.2, time);
                        this.playTone(freq * 0.5, eighth * 1.1, 'triangle', 0.25, time);
                    };

                    // Melody - A minor, serious tone (Am→Dm→E→Am, i-iv-V-i)
                    const melody = [
                        // Bar 1: Am - low register, deliberate (i)
                        220, 220, 262, 262, 330, 330, 330, 0,
                        // Bar 2: Dm - weight and gravity (iv)
                        294, 294, 349, 349, 294, 294, 262, 0,
                        // Bar 3: E - tension with G# (V)
                        330, 330, 415, 415, 494, 494, 330, 0,
                        // Bar 4: Am - resolve, descending
                        440, 392, 330, 330, 220, 220, 220, 0,
                        // Bar 5: Dm→Am descent
                        294, 294, 220, 220, 330, 330, 220, 0,
                        // Bar 6: E→Am final resolve
                        330, 415, 494, 494, 440, 330, 262, 220,
                        // Bar 7-8: Am pedal tone
                        220, 220, 220, 0, 0, 0, 0, 0,
                    ];

                    // Bass - fifths in Am: A→D→E→A
                    const bassNotes = [
                        // Bar 1-2: Am to Dm
                        110, 0, 110, 0, 220, 0, 110, 0,
                        73, 0, 73, 0, 147, 0, 73, 0,
                        // Bar 3-4: E to Am (V-i)
                        82, 0, 82, 0, 165, 0, 82, 0,
                        110, 0, 110, 0, 220, 0, 110, 0,
                        // Bar 5-6: Dm to E (iv-V)
                        73, 0, 73, 0, 147, 0, 73, 0,
                        82, 0, 82, 0, 165, 0, 82, 0,
                        // Bar 7-8: Am resolve
                        110, 0, 110, 0, 110, 0, 0, 0,
                    ];

                    const totalEighths = melody.length;
                    const loopDuration = totalEighths * eighth;

                    // Schedule melody
                    melody.forEach((freq, i) => {
                        const time = i * eighth;
                        if (freq > 0) {
                            // Lead synth (bright square wave - very 80s)
                            this.playTone(freq, eighth * 0.85, 'square', 0.15, time);
                            // Detuned second oscillator for thickness
                            this.playTone(freq * 1.005, eighth * 0.85, 'square', 0.08, time);
                            // Add brass layer on held notes (same freq as previous)
                            if (i > 0 && melody[i-1] === freq) {
                                this.playTone(freq, eighth * 0.9, 'sawtooth', 0.08, time);
                            }
                        }
                    });

                    // Schedule bass
                    bassNotes.forEach((freq, i) => {
                        if (freq > 0) {
                            playBass(freq, i * eighth);
                        }
                    });

                    // Schedule drums on strict 1/8 grid
                    for (let i = 0; i < totalEighths; i++) {
                        const time = i * eighth;
                        // Kick on 1 and 5 (beats 0, 4 of each 8)
                        if (i % 8 === 0 || i % 8 === 4) playKick(time);
                        // Snare on 3 and 7 (beats 2, 6 of each 8)
                        if (i % 8 === 2 || i % 8 === 6) playSnare(time);
                        // Hi-hat on every 1/8, open on downbeats
                        playHat(time, i % 4 === 0);
                    }

                    this.jingleTimeout = setTimeout(() => playLoop(), loopDuration * 1000);
                };

                playLoop();
            }

            // Fanfare of Glory - triumphant brass fanfare
            playFanfare() {
                if (!this.initialized || this.muted) {
                    this.currentTrack = 'fanfare';
                    return;
                }
                if (this.currentTrack === 'fanfare' && this.jinglePlaying) return;
                this.stopJingle();
                this.currentTrack = 'fanfare';
                this.jinglePlaying = true;

                const playLoop = () => {
                    if (!this.jinglePlaying || this.muted) return;

                    // Timpani drum hits
                    const playTimpani = (time, accent = false) => {
                        this.playTone(80, 0.15, 'triangle', accent ? 0.4 : 0.25, time);
                        this.playTone(60, 0.2, 'sine', accent ? 0.3 : 0.2, time);
                    };

                    // Cymbal crash
                    const playCymbal = (time) => {
                        for (let i = 0; i < 8; i++) {
                            this.playTone(4000 + Math.random() * 4000, 0.3, 'sawtooth', 0.03, time + i * 0.01);
                        }
                    };

                    // Fanfare melody - triumphant brass in Bb major
                    const melody = [
                        // Opening call - "Rise up!"
                        { freq: 466, dur: 0.15 },  // Bb4
                        { freq: 466, dur: 0.15 },  // Bb4
                        { freq: 466, dur: 0.15 },  // Bb4
                        { freq: 587, dur: 0.5 },   // D5 (held)
                        { freq: 0, dur: 0.1 },
                        // Answer phrase - "The day is won!"
                        { freq: 523, dur: 0.15 },  // C5
                        { freq: 523, dur: 0.15 },  // C5
                        { freq: 523, dur: 0.15 },  // C5
                        { freq: 698, dur: 0.5 },   // F5 (held)
                        { freq: 0, dur: 0.1 },
                        // Rising triumph - "A new age has begun!"
                        { freq: 587, dur: 0.2 },   // D5
                        { freq: 659, dur: 0.2 },   // E5
                        { freq: 698, dur: 0.2 },   // F5
                        { freq: 784, dur: 0.2 },   // G5
                        { freq: 880, dur: 0.6 },   // A5 (climax)
                        { freq: 0, dur: 0.15 },
                        // Descending resolution
                        { freq: 784, dur: 0.15 },  // G5
                        { freq: 698, dur: 0.15 },  // F5
                        { freq: 587, dur: 0.15 },  // D5
                        { freq: 466, dur: 0.5 },   // Bb4 (resolution)
                        { freq: 0, dur: 0.2 },
                        // Second verse - more elaborate
                        { freq: 587, dur: 0.1 },   // D5
                        { freq: 587, dur: 0.1 },   // D5
                        { freq: 698, dur: 0.1 },   // F5
                        { freq: 587, dur: 0.1 },   // D5
                        { freq: 784, dur: 0.4 },   // G5
                        { freq: 698, dur: 0.4 },   // F5
                        { freq: 0, dur: 0.1 },
                        // Grand finale
                        { freq: 466, dur: 0.2 },   // Bb4
                        { freq: 587, dur: 0.2 },   // D5
                        { freq: 698, dur: 0.2 },   // F5
                        { freq: 880, dur: 0.3 },   // A5
                        { freq: 932, dur: 0.6 },   // Bb5 (high climax!)
                        { freq: 0, dur: 0.6 },     // pause before loop
                    ];

                    let time = 0;
                    let beat = 0;

                    melody.forEach((note, i) => {
                        if (note.freq > 0) {
                            // Bright brass (sawtooth with harmonics)
                            this.playTone(note.freq, note.dur * 0.9, 'sawtooth', 0.18, time);
                            // Second trumpet harmony (third above on long notes)
                            if (note.dur >= 0.3) {
                                this.playTone(note.freq * 1.25, note.dur * 0.9, 'sawtooth', 0.1, time);
                            }
                            // French horn fifth below
                            if (note.dur >= 0.2) {
                                this.playTone(note.freq * 0.667, note.dur * 1.1, 'triangle', 0.15, time);
                            }
                            // Tuba bass on downbeats
                            if (beat % 4 === 0) {
                                this.playTone(note.freq * 0.25, note.dur * 1.3, 'triangle', 0.25, time);
                            }
                        }
                        // Timpani on strong beats
                        if (note.dur >= 0.3 && note.freq > 0) {
                            playTimpani(time, beat % 4 === 0);
                        }
                        // Cymbal on climax notes
                        if (note.freq >= 880) {
                            playCymbal(time);
                        }
                        beat++;
                        time += note.dur;
                    });

                    this.jingleTimeout = setTimeout(() => playLoop(), time * 1000);
                };

                playLoop();
            }

            // Chomp sound - quick waka waka
            playChomp() {
                if (!this.initialized || this.muted) return;
                this.playTone(400, 0.05, 'square', 0.15);
                this.playTone(300, 0.05, 'square', 0.15, 0.05);
            }

            // Update collect - sparkly special sound
            playUpdateCollect() {
                if (!this.initialized || this.muted) return;
                this.playTone(880, 0.08, 'sine', 0.2);
                this.playTone(1108, 0.08, 'sine', 0.2, 0.08);
                this.playTone(1318, 0.08, 'sine', 0.2, 0.16);
                this.playTone(1760, 0.15, 'sine', 0.25, 0.24);
            }

            // Warning alarm - urgent two-tone siren
            playAlarm() {
                if (!this.initialized || this.muted) return;
                for (let i = 0; i < 3; i++) {
                    this.playTone(880, 0.12, 'square', 0.18, i * 0.3);
                    this.playTone(660, 0.12, 'square', 0.18, i * 0.3 + 0.15);
                }
            }

            // Hit by enemy - comedic bonk
            playHit() {
                if (!this.initialized || this.muted) return;
                // Descending bonk
                this.playTone(400, 0.1, 'sawtooth', 0.25);
                this.playTone(200, 0.15, 'sawtooth', 0.2, 0.1);
                this.playTone(100, 0.2, 'sawtooth', 0.15, 0.25);
                // Funny boing
                this.playTone(150, 0.1, 'triangle', 0.2, 0.4);
                this.playTone(250, 0.1, 'triangle', 0.15, 0.45);
            }

            // Game over - sad trombone
            playGameOver() {
                if (!this.initialized || this.muted) return;
                const sadNotes = [
                    { freq: 392, dur: 0.3 },   // G4
                    { freq: 370, dur: 0.3 },   // F#4
                    { freq: 349, dur: 0.3 },   // F4
                    { freq: 330, dur: 0.6 },   // E4 (held, sad)
                ];
                let time = 0;
                sadNotes.forEach(note => {
                    this.playTone(note.freq, note.dur, 'triangle', 0.25, time);
                    this.playTone(note.freq * 0.5, note.dur, 'triangle', 0.15, time);
                    time += note.dur;
                });
                // Final wobble for comedic effect
                for (let i = 0; i < 6; i++) {
                    this.playTone(165 + (i % 2) * 10, 0.1, 'sawtooth', 0.1, time + i * 0.08);
                }
            }

            // Win fanfare
            playWin() {
                if (!this.initialized || this.muted) return;
                const fanfare = [
                    { freq: 523, dur: 0.15 },  // C5
                    { freq: 659, dur: 0.15 },  // E5
                    { freq: 784, dur: 0.15 },  // G5
                    { freq: 1047, dur: 0.4 },  // C6
                ];
                let time = 0;
                fanfare.forEach((note, i) => {
                    this.playTone(note.freq, note.dur, 'square', 0.2, time);
                    this.playTone(note.freq * 0.5, note.dur, 'triangle', 0.15, time);
                    time += note.dur;
                });
                // Victory sparkles
                for (let i = 0; i < 5; i++) {
                    this.playTone(1500 + i * 200, 0.1, 'sine', 0.1, time + i * 0.1);
                }
            }

            // Start game blip
            playStartGame() {
                if (!this.initialized || this.muted) return;
                this.playTone(523, 0.08, 'square', 0.2);
                this.playTone(784, 0.08, 'square', 0.2, 0.08);
                this.playTone(1047, 0.15, 'square', 0.25, 0.16);
            }
        }

        // Global sound manager instance
        const soundManager = new SoundManager();

        // Mute button functionality
        document.getElementById('mute-btn').addEventListener('click', () => {
            soundManager.setMuted(!soundManager.muted);
            document.getElementById('mute-btn').textContent = soundManager.muted ? 'Sound on' : 'Sound off';
        });

        // Game Configuration
        const TILE_SIZE = 32;

            createPlayerTextures() {
                // Chomp frames carved out of the real logo artwork, so the

                const makeFrame = (key, t) => {
                    const size = 64;
                    const tex = this.textures.createCanvas(key, size, size);
                    const ctx = tex.getContext();
                    if (this.textures.exists('player')) {
                        ctx.drawImage(this.textures.get('player').getSourceImage(), 0, 0, size, size);

                        ctx.globalCompositeOperation = 'destination-out';

                        ctx.closePath();
                        ctx.fill();
                        ctx.globalCompositeOperation = 'source-over';

                    tex.refresh();

                gReq.fillRect(6, 6, 4, 4);
                gReq.generateTexture('dot_requirement', 16, 16);

                // Create flag enemies
                const starPoints = (cx, cy, rOuter, rInner, n = 5) => {
                    const pts = [];
                    for (let k = 0; k < n * 2; k++) {
                        const r = k % 2 === 0 ? rOuter : rInner;
                        const a = (k * Math.PI) / n - Math.PI / 2;
                        pts.push(new Phaser.Geom.Point(cx + Math.cos(a) * r, cy + Math.sin(a) * r));
                    }
                    return pts;
                };

                FLAGS.forEach((flag, i) => {

                        g.fillRect(X, Y, W, H);

                        for (let j = 0; j < 12; j++) {

                    } else if (flag.name === 'US') {

                        g.fillRect(X, Y, W, H);
                        g.fillStyle(0xFEDD00, 1);
                        g.beginPath();
                        g.moveTo(32, Y + 4);
                        g.lineTo(X + W - 5, 32);
                        g.lineTo(32, Y + H - 4);
                        g.lineTo(X + 5, 32);
                        g.closePath();
                        g.fillPath();
                        g.fillStyle(0x012169, 1);
                        g.fillCircle(32, 32, 9);
                        g.lineStyle(1.8, 0xFFFFFF, 1);
                        g.beginPath();
                        g.arc(32, 46, 19, -Math.PI * 0.7, -Math.PI * 0.3);

                    } else if (flag.name === 'S.Korea') {

                        g.fillCircle(32 + 4.5, 32, 4.5);
                        // Trigram bars in the corners
                        g.fillStyle(0x141414, 1);
                        [[X + 6, Y + 6], [X + W - 14, Y + 6], [X + 6, Y + H - 13], [X + W - 14, Y + H - 13]].forEach(pt => {

        class GameScene extends Phaser.Scene {
            constructor() {
                super({ key: 'GameScene' });
            }

            init() {
                this.score = 0;
                this.lives = 3;
                this.totalDots = 0;
                this.collectedDots = 0;
                this.initialDots = 0;
                this.collectedInitialDots = 0;
                this.gameOver = false;
                this.invulnerable = false;
                this.currentDirection = null;
                this.inputDirection = null;
                this.validSpawnPositions = [];
                this.updateDots = [];
                this.activeUpdates = 0; // Counter for active update dots
                this.totalUpdatesAdded = 0; // Total updates spawned this game (max 15)
                // Chomping animation state
                this.chompStep = 0;
                this.chompTimer = 0;
                this.chompInterval = 70; // ms between chomp frames
                // Category counts
                this.counts = {
                    standards: 0,
                    legislations: 0,
                    markings: 0,
                    requirements: 0
                };
            }

            create() {
                // Start/continue the background music (loops automatically)
                soundManager.init();
                soundManager.playSpaceHero();

                // Reset sidebar counts
                this.updateSidebarCounts();

                // Create maze
                this.createMaze();

                // Create collectibles
                this.createCollectibles();

                // Create player
                this.createPlayer();

                // Create enemies
                this.createEnemies();

                // Create UI
                this.createUI();

                // Setup input
                this.input.keyboard.addCapture('SPACE');
                this.cursors = this.input.keyboard.createCursorKeys();
                this.wasd = this.input.keyboard.addKeys({
                    up: Phaser.Input.Keyboard.KeyCodes.W,
                    down: Phaser.Input.Keyboard.KeyCodes.S,
                    left: Phaser.Input.Keyboard.KeyCodes.A,
                    right: Phaser.Input.Keyboard.KeyCodes.D
                });

                // Collisions
                this.physics.add.collider(this.player, this.walls);
                this.physics.add.collider(this.enemies, this.walls);
                this.physics.add.overlap(this.player, this.dots, this.collectDot, null, this);
                this.physics.add.overlap(this.player, this.enemies, this.hitEnemy, null, this);
            }

            createMaze() {
                this.walls = this.physics.add.staticGroup();

                for (let y = 0; y < MAZE_HEIGHT; y++) {
                    for (let x = 0; x < MAZE_WIDTH; x++) {
                        if (MAZE[y][x] === 1) {
                            const wall = this.walls.create(
                                x * TILE_SIZE + TILE_SIZE / 2,
                                y * TILE_SIZE + TILE_SIZE / 2,
                                'wall'
                            );
                            wall.setDisplaySize(TILE_SIZE, TILE_SIZE);
                        }
                    }
                }
            }

            createCollectibles() {
                this.dots = this.physics.add.group();

                // Distribution: 50% requirements, 20% compliance elements, 20% legislations, 10% markings
                const getRandomCategory = () => {
                    const rand = Math.random();
                    if (rand < 0.50) return 'requirements';
                    if (rand < 0.70) return 'standards';
                    if (rand < 0.90) return 'legislations';
                    return 'markings';
                };

                const categoryIndices = {
                    standards: 0,
                    legislations: 0,
                    markings: 0,
                    requirements: 0
                };

                for (let y = 0; y < MAZE_HEIGHT; y++) {
                    for (let x = 0; x < MAZE_WIDTH; x++) {
                        if (MAZE[y][x] === 2) {
                            // Store valid spawn positions for later updates
                            this.validSpawnPositions.push({ x, y });

                            const category = getRandomCategory();
                            const items = COLLECTIBLES[category];
                            const itemIndex = categoryIndices[category] % items.length;
                            categoryIndices[category]++;

                            const textureMap = {
                                standards: 'dot_standard',
                                legislations: 'dot_legislation',
                                markings: 'dot_marking',
                                requirements: 'dot_requirement'
                            };

                            const dot = this.dots.create(
                                x * TILE_SIZE + TILE_SIZE / 2,
                                y * TILE_SIZE + TILE_SIZE / 2,
                                textureMap[category]
                            );
                            dot.itemName = items[itemIndex];
                            dot.category = category;
                            dot.setDisplaySize(category === 'requirements' ? 12 : 14, category === 'requirements' ? 12 : 14);
                            dot.isUpdate = false;
                            this.totalDots++;
                            this.initialDots++;
                        }
                    }
                }

                // Start spawning update dots periodically
                this.time.addEvent({
                    delay: 5000, // Every 5 seconds
                    callback: this.spawnUpdateDot,
                    callbackScope: this,
                    loop: true
                });
            }

            spawnUpdateDot() {
                if (this.gameOver) return;
                if (this.totalUpdatesAdded >= 15) return; // Max 15 updates per game

                // Find positions not currently occupied by dots
                const occupiedPositions = new Set();
                this.dots.getChildren().forEach(dot => {
                    const tileX = Math.floor(dot.x / TILE_SIZE);
                    const tileY = Math.floor(dot.y / TILE_SIZE);
                    occupiedPositions.add(`${tileX},${tileY}`);
                });

                const availablePositions = this.validSpawnPositions.filter(pos =>
                    !occupiedPositions.has(`${pos.x},${pos.y}`)
                );

                if (availablePositions.length === 0) return;

                // Pick random position
                const pos = Phaser.Math.RND.pick(availablePositions);

                // Create update dot
                const updateDot = this.dots.create(
                    pos.x * TILE_SIZE + TILE_SIZE / 2,
                    pos.y * TILE_SIZE + TILE_SIZE / 2,
                    'update_dot'
                );
                updateDot.itemName = 'UPDATE';
                updateDot.category = 'update';
                updateDot.setDisplaySize(20, 20);
                updateDot.isUpdate = true;
                this.totalDots++;

                // Add "UPDATE" label above the dot - green theme
                const label = this.add.text(updateDot.x, updateDot.y - 18, 'UPDATE', {
                    fontSize: '9px',
                    fontFamily: 'Geist Mono',
                    fontStyle: '600',
                    color: '#7DA3E0'
                }).setOrigin(0.5);
                updateDot.label = label;

                // Pulsing glow animation for the dot
                this.tweens.add({
                    targets: updateDot,
                    alpha: 0.6,
                    scaleX: 1.3,
                    scaleY: 1.3,
                    duration: 600,
                    ease: 'Sine.easeInOut',
                    yoyo: true,
                    repeat: -1
                });

                // Pulsing animation for the label
                this.tweens.add({
                    targets: label,
                    alpha: 0.4,
                    duration: 600,
                    ease: 'Sine.easeInOut',
                    yoyo: true,
                    repeat: -1
                });

                // Increment updates counter
                this.activeUpdates++;
                this.totalUpdatesAdded++;
                this.updateUpdatesText();

                // Show alert if too many untaken updates
                this.checkUpdateAlert();
            }

            checkUpdateAlert() {
                if (this.activeUpdates > 5) {
                    if (!this.updateAlert.visible) {
                        // Start countdown
                        this.updateCountdown = 10;
                        this.updateAlertText();
                        this.updateAlert.setVisible(true);
                        soundManager.playAlarm();

                        // Flash animation
                        if (this.alertFlashTween) this.alertFlashTween.stop();
                        this.alertFlashTween = this.tweens.add({
                            targets: this.updateAlert,
                            alpha: 0.3,
                            duration: 300,
                            ease: 'Sine.easeInOut',
                            yoyo: true,
                            repeat: -1
                        });

                        // Start countdown timer
                        if (this.countdownEvent) this.countdownEvent.remove();
                        this.countdownEvent = this.time.addEvent({
                            delay: 1000,
                            callback: this.tickCountdown,
                            callbackScope: this,
                            repeat: 9
                        });
                    }
                } else {
                    this.clearAlert();
                }
            }

            clearAlert() {
                // Stop countdown and hide alert
                if (this.countdownEvent) {
                    this.countdownEvent.remove();
                    this.countdownEvent = null;
                }
                this.updateAlert.setVisible(false);
                this.updateAlert.setAlpha(1);
                if (this.alertFlashTween) {
                    this.alertFlashTween.stop();
                    this.alertFlashTween = null;
                }
                this.updateCountdown = 10;
            }

            updateUpdatesText() {
                this.updatesText.setText(this.activeUpdates + ' / 5');
                this.updatesText.setColor(this.activeUpdates > 5 ? '#FFC53D' : '');
            }

            updateAlertText() {
                this.updateAlert.setText(
                    'TOO MANY UPDATES PENDING (' + this.activeUpdates + '/5)\n' +
                    'COLLECT THEM OR LOSE A PRODUCT IN ' + this.updateCountdown + 'S'
                );
            }

            tickCountdown() {
                if (this.gameOver) return;
                this.updateCountdown--;
                if (this.updateCountdown <= 0) {
                    // Time's up - lose a life
                    this.lives--;
                    this.livesText.setText(String(this.lives));
                    this.cameras.main.flash(200, 235, 240, 248);
                    soundManager.playHit();

                    if (this.lives <= 0) {
                        this.loseGame(null);
                    } else {
                        // Say why the player just got punished
                        this.showTimeoutPenalty();
                        // Reset countdown
                        this.updateCountdown = 10;
                        this.updateAlertText();
                        this.countdownEvent = this.time.addEvent({
                            delay: 1000,
                            callback: this.tickCountdown,
                            callbackScope: this,
                            repeat: 9
                        });
                    }
                } else {
                    this.updateAlertText();
                }
            }

            showTimeoutPenalty() {
                const centerX = this.cameras.main.centerX;
                const centerY = this.cameras.main.centerY;

                const msg = this.add.text(centerX, centerY - 40,
                    'UPDATES IGNORED — PRODUCT WITHDRAWN\nPRODUCTS REMAINING: ' + this.lives, {
                    fontSize: '14px',
                    fontFamily: 'Geist Mono',
                    fontStyle: '600',
                    color: '#141414',
                    backgroundColor: '#FFFFFF',
                    align: 'center',
                    padding: { x: 16, y: 12 }
                }).setOrigin(0.5).setDepth(30).setScale(0);

                this.tweens.add({
                    targets: msg,
                    scale: 1,
                    duration: 200,
                    ease: 'Back.easeOut'
                });
                this.tweens.add({
                    targets: msg,
                    alpha: 0,
                    delay: 2200,
                    duration: 400,
                    onComplete: () => msg.destroy()
                });
            }

            createPlayer() {
                // Find player spawn position
                let spawnX = 9, spawnY = 16;
                for (let y = 0; y < MAZE_HEIGHT; y++) {
                    for (let x = 0; x < MAZE_WIDTH; x++) {
                        if (MAZE[y][x] === 4) {
                            spawnX = x;
                            spawnY = y;
                        }
                    }
                }

                this.player = this.physics.add.sprite(
                    spawnX * TILE_SIZE + TILE_SIZE / 2,
                    spawnY * TILE_SIZE + TILE_SIZE / 2,
                    'player_0'
                );
                this.player.setDisplaySize(26, 26);
                this.player.setDepth(10); // Ensure player renders on top
                this.playerSpawnX = spawnX * TILE_SIZE + TILE_SIZE / 2;
                this.playerSpawnY = spawnY * TILE_SIZE + TILE_SIZE / 2;
                this.playerRotation = 0; // facing right
            }

            createEnemies() {
                this.enemies = this.physics.add.group();

                // Spawn enemies at different corners of the maze on valid path tiles
                const spawnPoints = [
                    { x: 1, y: 1, dir: 'right' },   // Top-left
                    { x: 17, y: 1, dir: 'left' },   // Top-right
                    { x: 1, y: 20, dir: 'right' },  // Bottom-left
                    { x: 17, y: 20, dir: 'left' }   // Bottom-right
                ];

                for (let i = 0; i < 4; i++) {
                    const spawn = spawnPoints[i];
                    const enemy = this.enemies.create(
                        spawn.x * TILE_SIZE + TILE_SIZE / 2,
                        spawn.y * TILE_SIZE + TILE_SIZE / 2,
                        'flag_' + i
                    );
                    enemy.setDisplaySize(28, 28);
                    enemy.flagName = FLAGS[i].name;
                    enemy.direction = spawn.dir;
                    enemy.spawnX = spawn.x * TILE_SIZE + TILE_SIZE / 2;
                    enemy.spawnY = spawn.y * TILE_SIZE + TILE_SIZE / 2;

                    // Gentle wave so the flags feel alive
                    this.tweens.add({
                        targets: enemy,
                        angle: { from: -4, to: 4 },
                        duration: 420 + i * 70,
                        yoyo: true,
                        repeat: -1,
                        ease: 'Sine.easeInOut'
                    });
                }
            }

            createUI() {
                // HUD lives in the page, not the canvas — bind the stat row elements
                const bind = id => {
                    const el = document.getElementById(id);
                    return {
                        setText: t => { if (el) el.textContent = t; },
                        setColor: c => { if (el) el.style.color = c; }
                    };
                };
                this.scoreText = bind('score-stat');
                this.livesText = bind('products-stat');
                this.progressText = bind('progress-stat');
                this.updatesText = bind('updates-stat');
                this.complianceText = bind('compliance-stat');

                this.scoreText.setText('0');
                this.livesText.setText(String(this.lives));
                this.progressText.setText('0 / ' + this.totalDots);
                this.updatesText.setText('0 / 5');
                this.updatesText.setColor('');
                this.complianceText.setText('0%');

                // Update alert with countdown (hidden by default) - positioned near top of game
                this.updateAlert = this.add.text(MAZE_WIDTH * TILE_SIZE / 2, 50, '', {
                    fontSize: '11px',
                    fontFamily: 'Geist Mono',
                    fontStyle: '600',
                    color: '#141414',
                    backgroundColor: '#FFFFFF',
                    align: 'center',
                    padding: { x: 14, y: 8 }
                }).setOrigin(0.5, 0.5).setDepth(100);
                this.updateAlert.setVisible(false);
                this.updateCountdown = 10;
                this.countdownEvent = null;
            }

            update(time, delta) {
                if (this.gameOver) return;

                // Handle input
                this.handleInput();

                // Move player with target-based movement
                this.movePlayer();

                // Animate player chomping and rotation
                this.animatePlayer(delta);

                // Move enemies
                this.moveEnemies();
            }

            animatePlayer(delta) {
                // Update rotation based on direction
                const targetRotations = {
                    'right': 0,
                    'down': Math.PI / 2,
                    'left': Math.PI,
                    'up': -Math.PI / 2
                };

                if (this.currentDirection) {
                    this.playerRotation = targetRotations[this.currentDirection];
                    this.player.setRotation(this.playerRotation);
                    this.player.setFlipY(this.currentDirection === 'left');

                    // Chomping animation while moving: closed, half, open, half
                    this.chompTimer += delta;
                    if (this.chompTimer >= this.chompInterval) {
                        this.chompTimer = 0;
                        this.chompStep = (this.chompStep + 1) % 4;
                        this.player.setTexture('player_' + [0, 1, 2, 1][this.chompStep]);
                    }
                } else {
                    // Rest with mouth closed when not moving
                    if (this.chompStep !== 0) {
                        this.chompStep = 0;
                        this.player.setTexture('player_0');
                    }
                }
            }

            handleInput() {
                // Capture current key state - only set if key is down
                if (this.cursors.left.isDown || this.wasd.left.isDown) {
                    this.inputDirection = 'left';
                } else if (this.cursors.right.isDown || this.wasd.right.isDown) {
                    this.inputDirection = 'right';
                } else if (this.cursors.up.isDown || this.wasd.up.isDown) {
                    this.inputDirection = 'up';
                } else if (this.cursors.down.isDown || this.wasd.down.isDown) {
                    this.inputDirection = 'down';
                } else {
                    this.inputDirection = null;
                }
            }

            movePlayer() {
                // Get current tile position (clamped while crossing the tunnel edges)
                const tileX = Phaser.Math.Clamp(Math.floor(this.player.x / TILE_SIZE), 0, MAZE_WIDTH - 1);
                const tileY = Phaser.Math.Clamp(Math.floor(this.player.y / TILE_SIZE), 0, MAZE_HEIGHT - 1);
                const tileCenterX = tileX * TILE_SIZE + TILE_SIZE / 2;
                const tileCenterY = tileY * TILE_SIZE + TILE_SIZE / 2;

                // Distance to tile center
                const distX = Math.abs(this.player.x - tileCenterX);
                const distY = Math.abs(this.player.y - tileCenterY);

                // More forgiving center detection
                const threshold = 6;
                const nearCenterX = distX < threshold;
                const nearCenterY = distY < threshold;

                // Try to change direction when near center
                if (nearCenterX && nearCenterY && this.inputDirection) {
                    if (this.canMoveInDirection(tileX, tileY, this.inputDirection)) {
                        // Snap to center when changing direction
                        this.player.x = tileCenterX;
                        this.player.y = tileCenterY;
                        this.currentDirection = this.inputDirection;
                    }
                }

                // Check if current direction is still valid
                if (this.currentDirection && nearCenterX && nearCenterY) {
                    if (!this.canMoveInDirection(tileX, tileY, this.currentDirection)) {
                        this.player.x = tileCenterX;
                        this.player.y = tileCenterY;
                        this.player.setVelocity(0);
                        this.currentDirection = null;
                        return;
                    }
                }

                // Apply velocity based on current direction
                if (this.currentDirection) {
                    switch (this.currentDirection) {
                        case 'left':
                            this.player.setVelocity(-PLAYER_SPEED, 0);
                            break;
                        case 'right':
                            this.player.setVelocity(PLAYER_SPEED, 0);
                            break;
                        case 'up':
                            this.player.setVelocity(0, -PLAYER_SPEED);
                            break;
                        case 'down':
                            this.player.setVelocity(0, PLAYER_SPEED);
                            break;
                    }
                } else {
                    this.player.setVelocity(0);
                }

                // Wrap through the side tunnels
                const worldWidth = MAZE_WIDTH * TILE_SIZE;
                if (this.player.x < -TILE_SIZE / 2) {
                    this.player.x = worldWidth + TILE_SIZE / 2;
                } else if (this.player.x > worldWidth + TILE_SIZE / 2) {
                    this.player.x = -TILE_SIZE / 2;
                }
            }

            canMoveInDirection(tileX, tileY, direction) {
                let checkX = tileX;
                let checkY = tileY;

                switch (direction) {
                    case 'left': checkX--; break;
                    case 'right': checkX++; break;
                    case 'up': checkY--; break;
                    case 'down': checkY++; break;
                }

                // Check vertical bounds
                if (checkY < 0 || checkY >= MAZE_HEIGHT) {
                    return false;
                }

                // Wrap horizontally so tunnel rows connect the left and right edges
                checkX = ((checkX % MAZE_WIDTH) + MAZE_WIDTH) % MAZE_WIDTH;

                // Check if wall
                return MAZE[checkY][checkX] !== 1;
            }

            canMove(sprite, direction) {
                const tileX = Math.floor(sprite.x / TILE_SIZE);
                const tileY = Math.floor(sprite.y / TILE_SIZE);
                return this.canMoveInDirection(tileX, tileY, direction);
            }

            moveEnemies() {
                const speed = ENEMY_SPEED;
                this.enemies.getChildren().forEach(enemy => {
                    // Wrap through the side tunnels
                    const worldWidth = MAZE_WIDTH * TILE_SIZE;
                    if (enemy.x < -TILE_SIZE / 2) {
                        enemy.x = worldWidth + TILE_SIZE / 2;
                    } else if (enemy.x > worldWidth + TILE_SIZE / 2) {
                        enemy.x = -TILE_SIZE / 2;
                    }

                    // Recover if somehow pushed out of vertical bounds
                    if (enemy.y < TILE_SIZE / 2 || enemy.y > MAZE_HEIGHT * TILE_SIZE - TILE_SIZE / 2) {
                        const tileX = Math.max(1, Math.min(MAZE_WIDTH - 2, Math.floor(enemy.x / TILE_SIZE)));
                        const tileY = Math.max(1, Math.min(MAZE_HEIGHT - 2, Math.floor(enemy.y / TILE_SIZE)));
                        enemy.x = tileX * TILE_SIZE + TILE_SIZE / 2;
                        enemy.y = tileY * TILE_SIZE + TILE_SIZE / 2;
                        this.changeEnemyDirection(enemy);
                    }

                    // Check if enemy is stuck (velocity blocked by wall)
                    const isStuck = enemy.body &&
                        Math.abs(enemy.body.velocity.x) < 5 &&
                        Math.abs(enemy.body.velocity.y) < 5;

                    if (isStuck) {
                        // Snap to nearest tile center and change direction
                        const tileX = Math.round((enemy.x - TILE_SIZE / 2) / TILE_SIZE);
                        const tileY = Math.round((enemy.y - TILE_SIZE / 2) / TILE_SIZE);
                        enemy.x = tileX * TILE_SIZE + TILE_SIZE / 2;
                        enemy.y = tileY * TILE_SIZE + TILE_SIZE / 2;
                        this.changeEnemyDirection(enemy);
                    }

                    // Get current tile center
                    const tileX = Math.floor(enemy.x / TILE_SIZE);
                    const tileY = Math.floor(enemy.y / TILE_SIZE);
                    const centerX = tileX * TILE_SIZE + TILE_SIZE / 2;
                    const centerY = tileY * TILE_SIZE + TILE_SIZE / 2;

                    // Check if near tile center (within 4 pixels)
                    const nearCenter = Math.abs(enemy.x - centerX) < 4 && Math.abs(enemy.y - centerY) < 4;

                    if (nearCenter) {
                        // Check if we need to change direction
                        if (!this.canMove(enemy, enemy.direction)) {
                            this.changeEnemyDirection(enemy);
                        } else {
                            // At intersection, maybe change direction
                            const validDirs = ['left', 'right', 'up', 'down'].filter(d => this.canMove(enemy, d));
                            if (validDirs.length > 2 && Math.random() < 0.01) {
                                this.changeEnemyDirection(enemy);
                            }
                        }
                    }

                    // Set velocity based on direction
                    switch (enemy.direction) {
                        case 'left': enemy.setVelocity(-speed, 0); break;
                        case 'right': enemy.setVelocity(speed, 0); break;
                        case 'up': enemy.setVelocity(0, -speed); break;
                        case 'down': enemy.setVelocity(0, speed); break;
                        default: enemy.setVelocity(0, 0);
                    }
                });
            }

            changeEnemyDirection(enemy, forceRandom = false) {
                const directions = ['left', 'right', 'up', 'down'];
                const validDirections = directions.filter(dir => this.canMove(enemy, dir));

                if (validDirections.length === 0) return;

                const opposite = {
                    'left': 'right',
                    'right': 'left',
                    'up': 'down',
                    'down': 'up'
                };

                // Don't go back unless it's the only option
                let candidates = validDirections.filter(dir => dir !== opposite[enemy.direction]);
                if (candidates.length === 0) candidates = validDirections;

                // 50% chance to bias toward player (simple chase behavior)
                if (!forceRandom && Math.random() < 0.5 && this.player) {
                    const dx = this.player.x - enemy.x;
                    const dy = this.player.y - enemy.y;

                    // Score directions by how much they move toward player
                    const scores = candidates.map(dir => {
                        let score = Math.random() * 0.5; // Base randomness
                        if (dir === 'left' && dx < 0) score += 1;
                        if (dir === 'right' && dx > 0) score += 1;
                        if (dir === 'up' && dy < 0) score += 1;
                        if (dir === 'down' && dy > 0) score += 1;
                        return { dir, score };
                    });

                    scores.sort((a, b) => b.score - a.score);
                    enemy.direction = scores[0].dir;
                } else {
                    enemy.direction = Phaser.Math.RND.pick(candidates);
                }
            }

            collectDot(player, dot) {
                // Check if it's an update dot (gives more points)
                const isUpdate = dot.isUpdate;
                const category = dot.category;

                // Points based on category
                const pointsMap = {
                    standards: 20,
                    legislations: 20,
                    markings: 15,
                    requirements: 5
                };
                const points = isUpdate ? 50 : (pointsMap[category] || 10);

                // Play appropriate sound effect
                if (isUpdate) {
                    soundManager.playUpdateCollect();
                    // Decrement updates counter
                    this.activeUpdates--;
                    this.updateUpdatesText();
                    this.checkUpdateAlert();
                } else {
                    soundManager.playChomp();
                    // Update category count
                    if (category && this.counts[category] !== undefined) {
                        this.counts[category]++;
                        this.updateSidebarCounts();
                    }
                }

                // Destroy label if it's an update dot
                if (dot.label) {
                    dot.label.destroy();
                }

                const dotX = dot.x;
                const dotY = dot.y;
                const itemName = dot.itemName || 'ITEM';

                dot.destroy();
                this.score += points;
                this.scoreText.setText(String(this.score));
                this.collectedDots++;
                this.progressText.setText(this.collectedDots + ' / ' + this.totalDots);

                // Show collected item name (shorter for requirements)
                const isReq = category === 'requirements';
                const displayName = isUpdate ? 'UPDATE +50' : (isReq ? '+' + points : itemName + ' +' + points);
                const nameText = this.add.text(dotX, dotY - 22, displayName, {
                    fontSize: isReq ? '10px' : '12px',
                    fontFamily: 'Geist Mono',
                    fontStyle: '600',
                    color: isUpdate ? '#10151F' : '#141414',
                    backgroundColor: isUpdate ? '#7DA3E0' : (isReq ? 'rgba(255, 255, 255, 0.95)' : '#FFC53D'),
                    padding: { x: 7, y: 4 }
                }).setOrigin(0.5).setDepth(15).setScale(0.6);

                // Keep long names fully on screen near the maze edges
                nameText.x = Phaser.Math.Clamp(dotX, nameText.width / 2 + 4, MAZE_WIDTH * TILE_SIZE - nameText.width / 2 - 4);

                // If the previous label still overlaps this one, replace it so text stays readable
                if (this.lastLabel && this.lastLabel.active) {
                    const overlaps = Math.abs(this.lastLabel.x - nameText.x) < (this.lastLabel.width + nameText.width) / 2 &&
                        Math.abs(this.lastLabel.y - nameText.y) < 24;
                    if (overlaps) {
                        this.tweens.killTweensOf(this.lastLabel);
                        this.lastLabel.destroy();
                    }
                }
                this.lastLabel = nameText;

                // Pop in, drift up, hold, then fade
                this.tweens.add({
                    targets: nameText,
                    scale: 1,
                    duration: 120,
                    ease: 'Back.easeOut'
                });
                this.tweens.add({
                    targets: nameText,
                    y: dotY - 52,
                    duration: 1100,
                    ease: 'Cubic.easeOut'
                });
                this.tweens.add({
                    targets: nameText,
                    alpha: 0,
                    delay: 650,
                    duration: 450,
                    onComplete: () => nameText.destroy()
                });

                // Track initial dots collected (not updates)
                if (!isUpdate) {
                    this.collectedInitialDots++;
                    this.complianceText.setText(
                        Math.round((this.collectedInitialDots / this.initialDots) * 100) + '%'
                    );
                    // Win when all initial dots are collected
                    if (this.collectedInitialDots >= this.initialDots) {
                        this.winGame();
                    }
                }
            }

            updateSidebarCounts() {
                // Update the HTML sidebar counts
                const stdEl = document.getElementById('standards-count');
                const legEl = document.getElementById('legislations-count');
                const markEl = document.getElementById('markings-count');
                const reqEl = document.getElementById('requirements-count');

                if (stdEl) stdEl.textContent = this.counts.standards;
                if (legEl) legEl.textContent = this.counts.legislations;
                if (markEl) markEl.textContent = this.counts.markings;
                if (reqEl) reqEl.textContent = this.counts.requirements;
            }

            hitEnemy(player, enemy) {
                if (this.gameOver || this.invulnerable) return;
                this.invulnerable = true;

                // Play hit sound
                soundManager.playHit();

                this.lives--;
                this.livesText.setText(String(this.lives));

                // Flash screen
                this.cameras.main.flash(200, 235, 240, 248);

                if (this.lives <= 0) {
                    this.loseGame(enemy);
                } else {
                    // Pause game temporarily
                    this.physics.pause();

                    // Show "Caught by" message
                    const centerX = this.cameras.main.centerX;
                    const centerY = this.cameras.main.centerY;

                    const overlay = this.add.rectangle(centerX, centerY,
                        MAZE_WIDTH * TILE_SIZE, MAZE_HEIGHT * TILE_SIZE, 0x0F141D, 0.94).setDepth(20);

                    // Warning text
                    const warningText = this.add.text(centerX, centerY - 55, 'A U D I T  V I O L A T I O N', {
                        fontSize: '11px',
                        fontFamily: 'Geist Mono',
                        fontStyle: '600',
                        color: '#6B80A0'
                    }).setOrigin(0.5).setAlpha(0).setDepth(21);

                    const caughtText = this.add.text(centerX, centerY - 5, 'CAUGHT BY ' + enemy.flagName.toUpperCase() + ' AUDITORS', {
                        fontSize: '24px',
                        fontFamily: 'Nabla'
                    }).setOrigin(0.5).setScale(0).setDepth(21);

                    // Fun letterforms, modest colour: desaturate the colour font
                    if (this.game.renderer.type === Phaser.WEBGL) {
                        caughtText.postFX.addColorMatrix().saturate(-0.75);
                    }

                    // Lives remaining
                    const livesText = this.add.text(centerX, centerY + 45, 'Products remaining: ' + this.lives, {
                        fontSize: '13px',
                        fontFamily: 'Geist',
                        color: '#98A0AE'
                    }).setOrigin(0.5).setAlpha(0).setDepth(21);

                    // Dramatic scale-in effect
                    this.tweens.add({
                        targets: caughtText,
                        scale: 1,
                        duration: 200,
                        ease: 'Back.easeOut',
                        onComplete: () => {
                            // Shake effect
                            this.tweens.add({
                                targets: caughtText,
                                x: centerX + 3,
                                duration: 50,
                                yoyo: true,
                                repeat: 10,
                                ease: 'Sine.easeInOut',
                                onComplete: () => {
                                    caughtText.setX(centerX);
                                }
                            });
                        }
                    });

                    // Fade in warning and lives text
                    this.tweens.add({
                        targets: [warningText, livesText],
                        alpha: 1,
                        duration: 300,
                        delay: 200
                    });

                    // Screen shake
                    this.cameras.main.shake(300, 0.01);

                    // After 3 seconds, remove message and continue
                    this.time.delayedCall(3000, () => {
                        overlay.destroy();
                        caughtText.destroy();
                        warningText.destroy();
                        livesText.destroy();

                        // Reset player position and state
                        this.player.setPosition(this.playerSpawnX, this.playerSpawnY);
                        this.player.setVelocity(0);
                        this.player.setRotation(0);
                        this.player.setTexture('player_0');
                        this.currentDirection = null;
                        this.inputDirection = null;
                        this.chompStep = 0;
                        this.playerRotation = 0;

                        // Send enemies back to their corners so they can't camp the spawn
                        this.enemies.getChildren().forEach(e => {
                            e.setPosition(e.spawnX, e.spawnY);
                            e.setVelocity(0);
                            this.changeEnemyDirection(e);
                        });

                        // Resume physics
                        this.physics.resume();

                        // Brief invulnerability
                        this.player.setAlpha(0.5);
                        this.time.delayedCall(1500, () => {
                            this.player.setAlpha(1);
                            this.invulnerable = false;
                        });
                    });
                }
            }

            winGame() {
                this.gameOver = true;
                this.player.setVelocity(0);
                this.enemies.getChildren().forEach(e => e.setVelocity(0));
                this.clearAlert();

                // Calculate penalty for remaining updates
                const updatePenalty = this.activeUpdates * 100;
                const finalScore = Math.max(0, this.score - updatePenalty);

                // Play win jingle, then loop the victory fanfare
                soundManager.stopJingle();
                soundManager.playWin();
                this.time.delayedCall(1500, () => {
                    if (this.gameOver) soundManager.playFanfare();
                });

                const centerX = this.cameras.main.centerX;
                const centerY = this.cameras.main.centerY;

                // Paper overlay
                const overlay = this.add.rectangle(centerX, centerY,
                    MAZE_WIDTH * TILE_SIZE, MAZE_HEIGHT * TILE_SIZE, 0x0F141D, 0.95).setDepth(20);

                this.add.text(centerX, centerY - 110, 'C O M P L I A N C E  1 0 0 %', {
                    fontSize: '11px',
                    fontFamily: 'Geist Mono',
                    fontStyle: '600',
                    color: '#6B80A0'
                }).setOrigin(0.5).setDepth(21);

                this.add.text(centerX, centerY - 70, 'COMPLIANCE ACHIEVED', {
                    fontSize: '30px',
                    fontFamily: 'Nabla'
                }).setOrigin(0.5).setDepth(21);

                this.add.rectangle(centerX, centerY - 35, 40, 1, 0xFFFFFF, 0.25).setDepth(21);

                this.add.text(centerX, centerY - 5, 'Score: ' + this.score.toLocaleString('en-US'), {
                    fontSize: '14px',
                    fontFamily: 'Geist',
                    color: '#98A0AE'
                }).setOrigin(0.5).setDepth(21);

                // Show penalty for remaining updates
                if (this.activeUpdates > 0) {
                    this.add.text(centerX, centerY + 20, 'Pending updates: −' + updatePenalty, {
                        fontSize: '13px',
                        fontFamily: 'Geist',
                        color: '#98A0AE'
                    }).setOrigin(0.5).setDepth(21);
                }

                this.add.text(centerX, centerY + 60, finalScore.toLocaleString('en-US'), {
                    fontSize: '40px',
                    fontFamily: 'Nabla'
                }).setOrigin(0.5).setDepth(21);

                this.add.text(centerX, centerY + 92, 'FINAL SCORE', {
                    fontSize: '9px',
                    fontFamily: 'Geist Mono',
                    fontStyle: '600',
                    color: '#6B80A0'
                }).setOrigin(0.5).setDepth(21);

                const restartBtn = this.add.text(centerX, centerY + 140, 'Press space to play again', {
                    fontSize: '13px',
                    fontFamily: 'Geist Mono',
                    color: '#7A8291'
                }).setOrigin(0.5).setDepth(21).setInteractive({ useHandCursor: true });

                const restart = () => this.scene.restart();
                this.input.keyboard.once('keydown-SPACE', restart);
                restartBtn.once('pointerdown', restart);
            }

            loseGame(enemy) {
                this.gameOver = true;
                this.player.setVelocity(0);
                this.enemies.getChildren().forEach(e => e.setVelocity(0));
                this.clearAlert();

                // Stop the music, play sad trombone game over sound
                soundManager.stopJingle();
                soundManager.playGameOver();

                const centerX = this.cameras.main.centerX;
                const centerY = this.cameras.main.centerY;

                // Currency mapping for each market
                const currencies = {
                    'EU': { symbol: '€', code: 'EUR', name: 'Euro' },
                    'US': { symbol: '$', code: 'USD', name: 'US Dollar' },
                    'Brazil': { symbol: 'R$', code: 'BRL', name: 'Brazilian Real' },
                    'S.Korea': { symbol: '₩', code: 'KRW', name: 'South Korean Won' }
                };

                const countryName = enemy ? enemy.flagName : 'Unknown';
                const currency = currencies[countryName] || currencies['US'];

                // Share of required compliance elements actually collected
                const compliancePct = this.initialDots > 0
                    ? Math.round((this.collectedInitialDots / this.initialDots) * 100) : 0;

                // Heavy camera shake
                this.cameras.main.shake(500, 0.02);

                // Overlay with dark theme
                const overlay = this.add.rectangle(centerX, centerY,
                    MAZE_WIDTH * TILE_SIZE, MAZE_HEIGHT * TILE_SIZE, 0x0F141D, 0.95).setDepth(20);

                // Non-compliance alert badge - flashing
                const alertBadge = this.add.text(centerX, centerY - 140, 'N O N - C O M P L I A N C E', {
                    fontSize: '11px',
                    fontFamily: 'Geist Mono',
                    fontStyle: '600',
                    color: '#6B80A0'
                }).setOrigin(0.5).setAlpha(0).setDepth(21);

                // Main audit failed text - starts scaled to 0
                const auditFailedText = this.add.text(centerX, centerY - 90, 'AUDIT FAILED', {
                    fontSize: '40px',
                    fontFamily: 'Nabla'
                }).setOrigin(0.5).setScale(0).setDepth(21);

                // Dramatic scale-in with shake
                this.tweens.add({
                    targets: auditFailedText,
                    scale: 1,
                    duration: 300,
                    ease: 'Back.easeOut',
                    onComplete: () => {
                        // Shake effect
                        this.tweens.add({
                            targets: auditFailedText,
                            x: centerX + 4,
                            duration: 40,
                            yoyo: true,
                            repeat: 15,
                            ease: 'Sine.easeInOut',
                            onComplete: () => {
                                auditFailedText.setX(centerX);
                            }
                        });
                    }
                });

                // Flash the alert badge
                this.tweens.add({
                    targets: alertBadge,
                    alpha: 1,
                    duration: 200,
                    delay: 100
                });
                this.tweens.add({
                    targets: alertBadge,
                    alpha: 0.5,
                    duration: 300,
                    yoyo: true,
                    repeat: -1,
                    delay: 500
                });

                // Other elements fade in
                const withdrawnText = this.add.text(centerX, centerY - 45,
                    'Product withdrawn from the ' + (enemy ? countryName : 'US') + ' market at ' + compliancePct + '% compliance', {
                    fontSize: '14px',
                    fontFamily: 'Geist',
                    color: '#98A0AE'
                }).setOrigin(0.5).setAlpha(0).setDepth(21);

                const dividerLine = this.add.rectangle(centerX, centerY - 10, 40, 1, 0xFFFFFF, 1)
                    .setAlpha(0).setDepth(21);

                const penaltyAmount = { value: 0 };
                // Penalty scales based on uncollected items: 0 if all collected, 2M if none collected
                const uncollectedRatio = this.totalDots > 0 ? (this.totalDots - this.collectedDots) / this.totalDots : 1;
                const targetPenalty = Math.round(2000000 * uncollectedRatio);
                const penaltyLabel = this.add.text(centerX, centerY + 20, 'PENALTY', {
                    fontSize: '9px',
                    fontFamily: 'Geist Mono',
                    fontStyle: '600',
                    color: '#6B80A0'
                }).setOrigin(0.5).setAlpha(0).setDepth(21);

                const penaltyText = this.add.text(centerX, centerY + 52, currency.symbol + '0', {
                    fontSize: '38px',
                    fontFamily: 'Geist Mono',
                    fontStyle: '600',
                    color: '#FFFFFF'
                }).setOrigin(0.5).setAlpha(0).setDepth(21);

                // Spell out the currency so the symbol is unambiguous
                const currencyNote = this.add.text(centerX, centerY + 84, currency.name + ' (' + currency.code + ')', {
                    fontSize: '11px',
                    fontFamily: 'Geist Mono',
                    color: '#7A8291'
                }).setOrigin(0.5).setAlpha(0).setDepth(21);

                // Counting animation for penalty
                this.tweens.add({
                    targets: penaltyAmount,
                    value: targetPenalty,
                    duration: 2000,
                    delay: 600,
                    ease: 'Cubic.easeOut',
                    onUpdate: () => {
                        const formatted = Math.floor(penaltyAmount.value).toLocaleString('en-US');
                        penaltyText.setText(currency.symbol + formatted);
                    }
                });

                const scoreText = this.add.text(centerX, centerY + 116, 'Score: ' + this.score.toLocaleString('en-US'), {
                    fontSize: '13px',
                    fontFamily: 'Geist',
                    color: '#98A0AE'
                }).setOrigin(0.5).setAlpha(0).setDepth(21);

                const restartText = this.add.text(centerX, centerY + 160, 'Press space to try again', {
                    fontSize: '13px',
                    fontFamily: 'Geist Mono',
                    color: '#7A8291'
                }).setOrigin(0.5).setAlpha(0).setDepth(21).setInteractive({ useHandCursor: true });

                // Staggered fade-in for other elements
                this.tweens.add({
                    targets: withdrawnText,
                    alpha: 1,
                    duration: 300,
                    delay: 400
                });
                this.tweens.add({
                    targets: dividerLine,
                    alpha: 0.2,
                    duration: 300,
                    delay: 500
                });
                this.tweens.add({
                    targets: [penaltyLabel, penaltyText, currencyNote],
                    alpha: 1,
                    duration: 300,
                    delay: 600
                });
                this.tweens.add({
                    targets: scoreText,
                    alpha: 1,
                    duration: 300,
                    delay: 800
                });
                this.tweens.add({
                    targets: restartText,
                    alpha: 1,
                    duration: 300,
                    delay: 1000
                });

                const restart = () => this.scene.restart();
                this.input.keyboard.once('keydown-SPACE', restart);
                restartText.once('pointerdown', restart);
            }
        }

        // Game configuration
        const config = {
            type: Phaser.AUTO,
            width: MAZE_WIDTH * TILE_SIZE,
            height: MAZE_HEIGHT * TILE_SIZE,
            parent: 'game-container',
            backgroundColor: '#0F141D',
            physics: {
                default: 'arcade',
                arcade: {
                    debug: false
                }
            },
            scene: [BootScene, MenuScene, GameScene]
        };

        // Start the game after fonts are loaded
        document.fonts.ready.then(() => {
            window.game = new Phaser.Game(config);
        });
    </script>
</body>
</html>
