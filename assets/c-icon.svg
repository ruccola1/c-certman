<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .stroke { fill: none; stroke: #5865F2; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Hexagon outline -->
  <path class="stroke" d="M50 5 L93 27.5 L93 72.5 L50 95 L7 72.5 L7 27.5 Z"/>

  <!-- Internal struts forming the C shape -->
  <!-- Top-left strut -->
  <line class="stroke" x1="50" y1="50" x2="7" y2="27.5"/>
  <!-- Bottom-left strut -->
  <line class="stroke" x1="50" y1="50" x2="7" y2="72.5"/>
  <!-- Top strut -->
  <line class="stroke" x1="50" y1="50" x2="50" y2="5"/>
  <!-- Bottom strut -->
  <line class="stroke" x1="50" y1="50" x2="50" y2="95"/>
  <!-- Top-right strut -->
  <line class="stroke" x1="50" y1="50" x2="93" y2="27.5"/>
  <!-- Bottom-right strut -->
  <line class="stroke" x1="50" y1="50" x2="93" y2="72.5"/>
</svg>