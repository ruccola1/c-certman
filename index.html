        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --ink: #10151F;
            --line: rgba(255, 255, 255, 0.11);
            --accent: #FFC53D;

        body {
            font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
            background: linear-gradient(180deg, #10151F 0%, #141414 100%);

        .stripe-field {
            position: fixed;
            inset: 0;
            pointer-events: none;

            background-image: repeating-linear-gradient(

            mask-image: linear-gradient(180deg, rgba(0,0,0,1) 0%, rgba(0,0,0,0.35) 55%, rgba(0,0,0,0.75) 100%);

        /* Display type: the arcade face, on the brand's black-and-blue ground */
        .display {
            font-family: 'Nabla', 'Geist', sans-serif;
            font-weight: 400;
        }
        /* Stat numerals carry the same arcade face */
        .figure {
            font-family: 'Nabla', 'Geist', sans-serif;
            font-weight: 400;
        }
        /* Force the display font to load before the canvas draws with it */
        .font-preload {
            font-family: 'Nabla', system-ui;
            position: absolute;
            left: -9999px;
            visibility: hidden;
        }
        /* A stat that just changed gets a quick arcade pop */
        @keyframes statFlash {
            0%   { filter: brightness(2.4); transform: translateY(-2px) scale(1.06); }
            60%  { filter: brightness(1.4); }
            100% { filter: none; transform: none; }
        }
        .flash { animation: statFlash 0.3s ease-out; }
        /* Anything urgent blinks like a warning lamp */
        @keyframes blink {
            0%, 49%   { opacity: 1; }
            50%, 100% { opacity: 0.25; }
        }
        .blink { animation: blink 0.55s steps(1, end) infinite; }
        /* The rows under the board hold a FIXED height. They used to grow as the
           counters got wider ("Requirements 77" wraps where "Requirements 0"
           did not), which stole height from the board and shrank the game
           mid-play. One row, one height, whatever the numbers say. */
        .legend-row { height: 34px; }
        .legend-row > div { flex: 0 0 auto; }
        .stat-cell .figure { display: block; }
        /* A short window gives its space to the board, not to the trimmings. */
        @media (max-height: 860px) {
            .legend-row { display: none; }
        }
        @media (max-height: 700px) {
            .eyebrow-row { display: none; }
            .stat-cell { padding-top: 7px; padding-bottom: 7px; }
        }
        /* Window mode: the board and the score strip, nothing else. */
        body.window-mode .page-header,
        body.window-mode .page-footer,
        body.window-mode .eyebrow-row,
        body.window-mode .legend-row { display: none !important; }
        body.window-mode .board-wrap { padding: 8px 0 0; }
        body.window-mode main { padding: 0 !important; }
        body.window-mode .shell { padding-left: 8px; padding-right: 8px; }
        body.embed-mode .board { border-color: rgba(255,255,255,0.14); }
        /* Framed, the score strip would otherwise sit flush against the panel edge. */
        body.embed-mode .shell { padding-bottom: 9px; }
        body.embed-mode { background: #0F141D; }
        .label {

        /* Board frame with technical corner ticks */

            content: "";

            width: 9px;
            height: 9px;

    <script>
        // ===== SOUND MANAGER (Web Audio API) =====
        class SoundManager {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.musicGain = null;   // every music note hangs off this bus
                this.musicMode = false;  // true while a track schedules its notes
                this.initialized = false;
                this.muted = false;
                this.jinglePlaying = false;
                this.jingleTimeout = null;
                this.currentTrack = null;
            }

            init() {
                if (this.initialized) {
                    this.resume();
                    return;
                }
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.connect(this.ctx.destination);
                    this.musicGain = this.ctx.createGain();
                    this.musicGain.gain.value = 0.8; // headroom for eight voices
                    this.musicGain.connect(this.masterGain);
                    this.initialized = true;
                    this.resume();
                } catch (e) {
                    console.warn('Web Audio not supported');
                }
            }

            // Browsers create AudioContext suspended until a user gesture
            resume() {
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            setMuted(muted) {
                this.muted = muted;
                if (this.masterGain) {
                    this.masterGain.gain.setValueAtTime(muted ? 0 : 1, this.ctx.currentTime);
                }
                if (muted) {
                    this.stopJingle(true);
                } else if (this.currentTrack === 'fanfare') {
                    this.playFanfare();
                } else if (this.currentTrack === 'anthem') {
                    this.playAnthem();
                } else if (this.currentTrack === 'cancan') {
                    this.playCanCan();
                }
            }

            // Play a note with given frequency, duration, and waveform
            playTone(freq, duration, type = 'square', volume = 0.3, delay = 0) {
                if (!this.initialized || this.muted) return;
                this.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(volume, this.ctx.currentTime + delay);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + delay + duration);
                osc.connect(gain);
                gain.connect(this.musicMode && this.musicGain ? this.musicGain : this.masterGain);
                osc.start(this.ctx.currentTime + delay);
                osc.stop(this.ctx.currentTime + delay + duration);
            }

            // Stop the looping jingle
            stopJingle(keepTrack = false) {
                this.jinglePlaying = false;
                this.musicMode = false;
                if (!keepTrack) {
                    this.currentTrack = null;
                }
                if (this.jingleTimeout) {
                    clearTimeout(this.jingleTimeout);
                    this.jingleTimeout = null;
                }
                // Notes are scheduled up to a bar ahead — drop the bus they are
                // connected to so nothing from the old track survives a restart
                if (this.musicGain) {
                    try { this.musicGain.disconnect(); } catch (e) { /* already gone */ }
                    this.musicGain = this.ctx.createGain();
                    this.musicGain.gain.value = 0.8;
                    this.musicGain.connect(this.masterGain);
                }
            }

            // The European anthem: the Ode to Joy theme from the finale of
            // Beethoven's Ninth, arranged for the square-wave band
            playAnthem() {
                if (!this.initialized || this.muted) {
                    // Remember what should be playing so init/unmute can resume it
                    this.currentTrack = 'anthem';
                    return;
                }
                // Don't restart if already playing
                if (this.currentTrack === 'anthem' && this.jinglePlaying) return;
                this.stopJingle();
                this.currentTrack = 'anthem';
                this.jinglePlaying = true;

                const N = {
                    // bass octave
                    F2: 87.31, G2: 98.00, A2: 110.00, B2: 123.47,
                    C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00, B3: 246.94,
                    // melody octave
                    C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00
                };
                // [frequency, beats] — the full 16-bar theme
                const MELODY = [
                    [N.E4, 1], [N.E4, 1], [N.F4, 1], [N.G4, 1],
                    [N.G4, 1], [N.F4, 1], [N.E4, 1], [N.D4, 1],
                    [N.C4, 1], [N.C4, 1], [N.D4, 1], [N.E4, 1],
                    [N.E4, 1.5], [N.D4, 0.5], [N.D4, 2],

                    [N.E4, 1], [N.E4, 1], [N.F4, 1], [N.G4, 1],
                    [N.G4, 1], [N.F4, 1], [N.E4, 1], [N.D4, 1],
                    [N.C4, 1], [N.C4, 1], [N.D4, 1], [N.E4, 1],
                    [N.D4, 1.5], [N.C4, 0.5], [N.C4, 2],

                    [N.D4, 1], [N.D4, 1], [N.E4, 1], [N.C4, 1],
                    [N.D4, 1], [N.E4, 0.5], [N.F4, 0.5], [N.E4, 1], [N.C4, 1],
                    [N.D4, 1], [N.E4, 0.5], [N.F4, 0.5], [N.E4, 1], [N.D4, 1],
                    [N.C4, 1], [N.D4, 1], [N.G3, 2],

                    [N.E4, 1], [N.E4, 1], [N.F4, 1], [N.G4, 1],
                    [N.G4, 1], [N.F4, 1], [N.E4, 1], [N.D4, 1],
                    [N.C4, 1], [N.C4, 1], [N.D4, 1], [N.E4, 1],
                    [N.D4, 1.5], [N.C4, 0.5], [N.C4, 2]
                ];
                // Second voice: the diatonic third under each melody note
                const THIRD = {};
                THIRD[N.C4] = N.A3; THIRD[N.D4] = N.B3; THIRD[N.E4] = N.C4;
                THIRD[N.F4] = N.D4; THIRD[N.G4] = N.E4; THIRD[N.G3] = N.E3;
                // Triads under each bar
                const CH = {
                    C: [N.C3, N.E3, N.G3],
                    G: [N.G2, N.B2, N.D3],
                    F: [N.F2, N.A2, N.C3]
                };
                const CHORDS = [
                    CH.C, CH.G, CH.C, CH.G, CH.C, CH.G, CH.F, CH.C,
                    CH.G, CH.C, CH.G, CH.C, CH.C, CH.G, CH.F, CH.C
                ];

                const playLoop = () => {
                    if (!this.jinglePlaying || this.muted) return;
                    this.musicMode = true;

                    const beat = 0.42;          // ~143 BPM, marching pace
                    const bars = CHORDS.length;

                    // Voices 1-3: square lead, an octave shimmer above it and a
                    // third below, so the tune moves in parallel harmony
                    let t = 0;
                    MELODY.forEach(note => {
                        const dur = beat * note[1];
                        this.playTone(note[0], dur * 0.92, 'square', 0.16, t);
                        this.playTone(note[0] * 2, dur * 0.45, 'triangle', 0.035, t);
                        const third = THIRD[note[0]];
                        if (third) this.playTone(third, dur * 0.9, 'square', 0.08, t);
                        t += dur;
                    });

                    for (let i = 0; i < bars; i++) {
                        const chord = CHORDS[i];
                        const bt = i * 4 * beat;

                        // Voices 4-6: a sustained triad twice a bar
                        [0, 2].forEach(half => {
                            const ht = bt + half * beat;
                            chord.forEach(f => this.playTone(f, beat * 1.85, 'triangle', 0.05, ht));
                            // Voice 7: walking bass, root then fifth
                            this.playTone(chord[0] / 2, beat * 0.9, 'sine', 0.2, ht);
                            this.playTone(chord[2] / 2, beat * 0.55, 'sine', 0.13, ht + beat);
                            // Kick
                            this.playTone(150, 0.08, 'sine', 0.24, ht);
                            this.playTone(50, 0.15, 'sine', 0.2, ht);
                        });

                        // Voice 8: a bright arpeggio on the offbeats
                        for (let h = 0; h < 4; h++) {
                            this.playTone(chord[h % 3] * 2, 0.12, 'triangle', 0.05, bt + h * beat + beat * 0.5);
                        }

                        // Kit: snare on three, hats on every beat
                        this.playTone(200, 0.05, 'square', 0.1, bt + 2 * beat);
                        for (let h = 0; h < 4; h++) {
                            this.playTone(8000, 0.02, 'square', h === 0 ? 0.05 : 0.03, bt + h * beat);
                        }
                    }

                    this.musicMode = false;
                    this.jingleTimeout = setTimeout(() => playLoop(), bars * 4 * beat * 1000);
                };

                playLoop();
            }

            /**
             * The victory lap: Offenbach's Galop infernal — the Can-Can from
             * "Orphee aux enfers" (Paris, 1858), public domain, arranged here
             * for the square-wave band. The Ode to Joy marches you through the
             * board; this is what plays once the board is clean.
             */
            playCanCan() {
                if (!this.initialized || this.muted) {
                    this.currentTrack = 'cancan';
                    return;
                }
                if (this.currentTrack === 'cancan' && this.jinglePlaying) return;
                this.stopJingle();
                this.currentTrack = 'cancan';
                this.jinglePlaying = true;

                const N = {
                    // bass octave
                    D2: 73.42, A2: 110.00, D3: 146.83, Fs3: 185.00, A3: 220.00, Cs4: 277.18,
                    // chord octave
                    D4: 293.66, E4: 329.63, Fs4: 369.99, G4: 392.00, A4: 440.00,
                    // melody
                    Cs5: 554.37, D5: 587.33, E5: 659.26, Fs5: 739.99, G5: 783.99,
                    Gs5: 830.61, A5: 880.00, B5: 987.77, D6: 1174.66, Fs6: 1479.98
                };
                // [frequency, start in beats, length in beats] — 24 bars of 2/4
                const MELODY = [
                    [N.A4, 0, 0.5], [N.E5, 0.5, 0.5], [N.E5, 1, 0.5], [N.Fs5, 1.5, 0.385], [N.Fs5, 1.885, 0.112],
                    [N.E5, 2, 0.5], [N.D5, 2.5, 0.5], [N.D5, 3, 0.5], [N.Fs5, 3.5, 0.5], [N.G5, 4, 0.5],
                    [N.B5, 4.5, 0.5], [N.D6, 5, 0.5], [N.B5, 5.5, 0.5], [N.B5, 6, 0.5], [N.A5, 6.5, 0.5],
                    [N.A5, 7, 1], [N.B5, 8, 0.5], [N.Cs5, 8.5, 0.5], [N.Cs5, 9, 0.5], [N.B5, 9.5, 0.5],
                    [N.A5, 10, 0.5], [N.D5, 10.5, 0.5], [N.D5, 11, 0.5], [N.Fs5, 11.5, 0.385],
                    [N.Gs5, 11.885, 0.112], [N.Fs5, 12, 0.5], [N.E5, 12.5, 0.5], [N.Fs5, 13, 0.5],
                    [N.E5, 13.5, 0.385], [N.Gs5, 13.885, 0.112], [N.Fs5, 14, 0.5], [N.E5, 14.5, 0.5],
                    [N.Fs5, 15, 0.5], [N.E5, 15.5, 0.5], [N.Fs6, 16, 1], [N.D6, 17, 1], [N.B5, 18, 1],
                    [N.A5, 19, 1], [N.A5, 20, 0.5], [N.E5, 20.5, 0.5], [N.Fs5, 21, 0.5], [N.G5, 21.5, 0.5],
                    [N.Fs5, 22, 0.5], [N.E5, 22.5, 0.5], [N.D5, 23, 1]
                ];
                const CH = {
                    D: { bass: N.D2, fifth: N.A2, triad: [N.D4, N.Fs4, N.A4] },
                    A: { bass: N.A2, fifth: N.E4 / 2, triad: [N.Cs4, N.E4, N.A4] }
                };
                const BARS = ['A','D','D','D','A','D','D','D','A','A','D','D',
                              'D','D','D','D','D','D','D','D','A','D','D','D'].map(k => CH[k]);

                const playLoop = () => {
                    if (!this.jinglePlaying || this.muted) return;
                    this.musicMode = true;

                    const beat = 0.375;             // 160 BPM, the galop's own pace
                    const bars = BARS.length;

                    // Lead: square melody with an octave shimmer over it
                    MELODY.forEach(note => {
                        const t = note[1] * beat;
                        const dur = note[2] * beat;
                        this.playTone(note[0], dur * 0.9, 'square', 0.17, t);
                        this.playTone(note[0] * 2, dur * 0.4, 'triangle', 0.03, t);
                    });

                    // Oom-pah: bass on the beat, chord stab off it — the galop engine
                    for (let i = 0; i < bars; i++) {
                        const ch = BARS[i];
                        const bt = i * 2 * beat;
                        [0, 1].forEach(half => {
                            const ht = bt + half * beat;
                            this.playTone(half === 0 ? ch.bass : ch.fifth, beat * 0.5, 'sine', 0.22, ht);
                            ch.triad.forEach(f => this.playTone(f, beat * 0.36, 'triangle', 0.05, ht + beat * 0.5));
                            this.playTone(150, 0.07, 'sine', 0.2, ht);
                            this.playTone(50, 0.13, 'sine', 0.17, ht);
                            // Hats on every eighth keep the gallop moving
                            this.playTone(8000, 0.02, 'square', half === 0 ? 0.045 : 0.028, ht);
                            this.playTone(8000, 0.02, 'square', 0.022, ht + beat * 0.5);
                        });
                        // Snare on the second beat
                        this.playTone(200, 0.05, 'square', 0.1, bt + beat);
                    }

                    this.musicMode = false;
                    this.jingleTimeout = setTimeout(() => playLoop(), bars * 2 * beat * 1000);
                };

                playLoop();
            }

            // A marking is stamped, not chomped: a press, then the seal rings out
            playMarking() {
                if (!this.initialized || this.muted) return;
                this.playTone(110, 0.09, 'sine', 0.3);            // the press
                this.playTone(70, 0.14, 'triangle', 0.22);
                [659.26, 830.61, 987.77, 1318.51].forEach((f, i) => {
                    this.playTone(f, i === 3 ? 0.34 : 0.1, 'square', 0.2, 0.09 + i * 0.075);
                    this.playTone(f * 2, 0.07, 'triangle', 0.06, 0.09 + i * 0.075);
                });
                for (let i = 0; i < 4; i++) {
                    this.playTone(1800 + i * 320, 0.07, 'sine', 0.07, 0.42 + i * 0.06);
                }
            }

            playFanfare() {
                if (!this.initialized || this.muted) {
                    this.currentTrack = 'fanfare';
                    return;
                }
                if (this.currentTrack === 'fanfare' && this.jinglePlaying) return;
                this.stopJingle();
                this.currentTrack = 'fanfare';
                this.jinglePlaying = true;

                const playLoop = () => {
                    if (!this.jinglePlaying || this.muted) return;
                    this.musicMode = true;

                    // Timpani drum hits
                    const playTimpani = (time, accent = false) => {
                        this.playTone(80, 0.15, 'triangle', accent ? 0.4 : 0.25, time);
                        this.playTone(60, 0.2, 'sine', accent ? 0.3 : 0.2, time);
                    };

                    // Cymbal crash
                    const playCymbal = (time) => {
                        for (let i = 0; i < 8; i++) {
                            this.playTone(4000 + Math.random() * 4000, 0.3, 'sawtooth', 0.03, time + i * 0.01);
                        }
                    };

                    // Fanfare melody - triumphant brass in Bb major
                    const melody = [
                        // Opening call - "Rise up!"
                        { freq: 466, dur: 0.15 },  // Bb4
                        { freq: 466, dur: 0.15 },  // Bb4
                        { freq: 466, dur: 0.15 },  // Bb4
                        { freq: 587, dur: 0.5 },   // D5 (held)
                        { freq: 0, dur: 0.1 },
                        // Answer phrase - "The day is won!"
                        { freq: 523, dur: 0.15 },  // C5
                        { freq: 523, dur: 0.15 },  // C5
                        { freq: 523, dur: 0.15 },  // C5
                        { freq: 698, dur: 0.5 },   // F5 (held)
                        { freq: 0, dur: 0.1 },
                        // Rising triumph - "A new age has begun!"
                        { freq: 587, dur: 0.2 },   // D5
                        { freq: 659, dur: 0.2 },   // E5
                        { freq: 698, dur: 0.2 },   // F5
                        { freq: 784, dur: 0.2 },   // G5
                        { freq: 880, dur: 0.6 },   // A5 (climax)
                        { freq: 0, dur: 0.15 },
                        // Descending resolution
                        { freq: 784, dur: 0.15 },  // G5
                        { freq: 698, dur: 0.15 },  // F5
                        { freq: 587, dur: 0.15 },  // D5
                        { freq: 466, dur: 0.5 },   // Bb4 (resolution)
                        { freq: 0, dur: 0.2 },
                        // Second verse - more elaborate
                        { freq: 587, dur: 0.1 },   // D5
                        { freq: 587, dur: 0.1 },   // D5
                        { freq: 698, dur: 0.1 },   // F5
                        { freq: 587, dur: 0.1 },   // D5
                        { freq: 784, dur: 0.4 },   // G5
                        { freq: 698, dur: 0.4 },   // F5
                        { freq: 0, dur: 0.1 },
                        // Grand finale
                        { freq: 466, dur: 0.2 },   // Bb4
                        { freq: 587, dur: 0.2 },   // D5
                        { freq: 698, dur: 0.2 },   // F5
                        { freq: 880, dur: 0.3 },   // A5
                        { freq: 932, dur: 0.6 },   // Bb5 (high climax!)
                        { freq: 0, dur: 0.6 },     // pause before loop
                    ];

                    let time = 0;
                    let beat = 0;

                    melody.forEach((note, i) => {
                        if (note.freq > 0) {
                            // Bright brass (sawtooth with harmonics)
                            this.playTone(note.freq, note.dur * 0.9, 'sawtooth', 0.18, time);
                            // Second trumpet harmony (third above on long notes)
                            if (note.dur >= 0.3) {
                                this.playTone(note.freq * 1.25, note.dur * 0.9, 'sawtooth', 0.1, time);
                            }
                            // French horn fifth below
                            if (note.dur >= 0.2) {
                                this.playTone(note.freq * 0.667, note.dur * 1.1, 'triangle', 0.15, time);
                            }
                            // Tuba bass on downbeats
                            if (beat % 4 === 0) {
                                this.playTone(note.freq * 0.25, note.dur * 1.3, 'triangle', 0.25, time);
                            }
                        }
                        // Timpani on strong beats
                        if (note.dur >= 0.3 && note.freq > 0) {
                            playTimpani(time, beat % 4 === 0);
                        }
                        // Cymbal on climax notes
                        if (note.freq >= 880) {
                            playCymbal(time);
                        }
                        beat++;
                        time += note.dur;
                    });

                    this.musicMode = false;
                    this.jingleTimeout = setTimeout(() => playLoop(), time * 1000);
                };

                playLoop();
            }

            // Chomp sound - quick waka waka
            playChomp() {
                if (!this.initialized || this.muted) return;
                this.playTone(400, 0.05, 'square', 0.15);
                this.playTone(300, 0.05, 'square', 0.15, 0.05);
            }

            // Update collect - sparkly special sound
            playUpdateCollect() {
                if (!this.initialized || this.muted) return;
                this.playTone(880, 0.08, 'sine', 0.2);
                this.playTone(1108, 0.08, 'sine', 0.2, 0.08);
                this.playTone(1318, 0.08, 'sine', 0.2, 0.16);
                this.playTone(1760, 0.15, 'sine', 0.25, 0.24);
            }

            // Warning alarm - urgent two-tone siren
            playAlarm() {
                if (!this.initialized || this.muted) return;
                for (let i = 0; i < 3; i++) {
                    this.playTone(880, 0.12, 'square', 0.18, i * 0.3);
                    this.playTone(660, 0.12, 'square', 0.18, i * 0.3 + 0.15);
                }
            }

            // Hit by enemy - comedic bonk
            playHit() {
                if (!this.initialized || this.muted) return;
                // Descending bonk
                this.playTone(400, 0.1, 'sawtooth', 0.25);
                this.playTone(200, 0.15, 'sawtooth', 0.2, 0.1);
                this.playTone(100, 0.2, 'sawtooth', 0.15, 0.25);
                // Funny boing
                this.playTone(150, 0.1, 'triangle', 0.2, 0.4);
                this.playTone(250, 0.1, 'triangle', 0.15, 0.45);
            }

            // Game over - sad trombone
            playGameOver() {
                if (!this.initialized || this.muted) return;
                const sadNotes = [
                    { freq: 392, dur: 0.3 },   // G4
                    { freq: 370, dur: 0.3 },   // F#4
                    { freq: 349, dur: 0.3 },   // F4
                    { freq: 330, dur: 0.6 },   // E4 (held, sad)
                ];
                let time = 0;
                sadNotes.forEach(note => {
                    this.playTone(note.freq, note.dur, 'triangle', 0.25, time);
                    this.playTone(note.freq * 0.5, note.dur, 'triangle', 0.15, time);
                    time += note.dur;
                });
                // Final wobble for comedic effect
                for (let i = 0; i < 6; i++) {
                    this.playTone(165 + (i % 2) * 10, 0.1, 'sawtooth', 0.1, time + i * 0.08);
                }
            }

            // Win fanfare
            playWin() {
                if (!this.initialized || this.muted) return;
                const fanfare = [
                    { freq: 523, dur: 0.15 },  // C5
                    { freq: 659, dur: 0.15 },  // E5
                    { freq: 784, dur: 0.15 },  // G5
                    { freq: 1047, dur: 0.4 },  // C6
                ];
                let time = 0;
                fanfare.forEach((note, i) => {
                    this.playTone(note.freq, note.dur, 'square', 0.2, time);
                    this.playTone(note.freq * 0.5, note.dur, 'triangle', 0.15, time);
                    time += note.dur;
                });
                // Victory sparkles
                for (let i = 0; i < 5; i++) {
                    this.playTone(1500 + i * 200, 0.1, 'sine', 0.1, time + i * 0.1);
                }
            }

            // Start game blip
            playStartGame() {
                if (!this.initialized || this.muted) return;
                this.playTone(523, 0.08, 'square', 0.2);
                this.playTone(784, 0.08, 'square', 0.2, 0.08);
                this.playTone(1047, 0.15, 'square', 0.25, 0.16);
            }
        }

        // Global sound manager instance
        const soundManager = new SoundManager();

        // Mute button functionality
        function labelMuteBtn() {
            const btn = document.getElementById('mute-btn');
            if (!btn) return;
            const short = window.innerWidth < 640;
            btn.textContent = soundManager.muted
                ? (short ? 'Muted' : 'Sound on')
                : (short ? 'Sound' : 'Sound off');
        }
        document.getElementById('mute-btn').addEventListener('click', () => {
            soundManager.setMuted(!soundManager.muted);
            labelMuteBtn();
        });
        labelMuteBtn();

        // ===== WINDOW MODE =====
        // The board is sized from whatever height the window leaves it, so the
        // game always fits exactly. This button removes the page around it:
        // full screen where that is supported (every phone), and otherwise a
        // popup window opened at the board's own proportions.
        const BOARD_ASPECT = 19 / 22;
        const params = new URLSearchParams(location.search);
        const isWindowMode = params.get('mode') === 'window';
        // Embedded: the game sits in a panel on certean.com. Same chrome-less
        // layout, no window button (a popup from inside a frame is no use),
        // and the result is handed to the host page when a round ends.
        const isEmbedded = params.get('embed') === '1' || window.parent !== window;
        if (isWindowMode || isEmbedded) document.body.classList.add('window-mode');
        if (isEmbedded) document.body.classList.add('embed-mode');

        /**
         * Tell the host how this page is proportioned, so a panel around it can
         * be cut to the game rather than to the window. Everything but the board
         * is a fixed height (the score strip) and a fixed width (the gutters),
         * so the host can solve for any size from these two numbers plus the
         * board's own 19:22.
         */
        function reportMetrics() {
            if (window.parent === window) return;
            const board = document.querySelector('.board');
            if (!board) return;
            const box = board.getBoundingClientRect();
            if (!box.height || !box.width) return;
            // The gutter is the shell's own padding, NOT whatever width happens
            // to be left over: the board is sized from the height it is given,
            // so a frame wider than it needs leaves slack that the host should
            // trim away rather than treat as part of the layout.
            const shell = document.querySelector('.shell');
            const gutter = shell ? Math.round(parseFloat(getComputedStyle(shell).paddingLeft) * 2) : 0;
            try {
                window.parent.postMessage({
                    source: 'compliance-man',
                    type: 'metrics',
                    chrome: Math.round(window.innerHeight - box.height),
                    gutter: gutter,
                    aspect: 19 / 22
                }, '*');
            } catch (e) { /* host on another origin and locked down */ }
        }

        /** Hand a finished round to the page that embedded us. */
        window.reportRound = function (outcome, score, extra) {
            if (window.parent === window) return;
            try {
                window.parent.postMessage(Object.assign({
                    source: 'compliance-man',
                    outcome: outcome,
                    score: score
                }, extra || {}), '*');
            } catch (e) { /* host on another origin and locked down */ }
        };

        const windowBtn = isEmbedded ? null : document.getElementById('window-btn');
        if (isEmbedded) {
            const hide = document.getElementById('window-btn');
            if (hide) hide.remove();
        }
        const canFullscreen = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
        const coarse = window.matchMedia('(pointer: coarse)').matches;

        const narrow = () => window.innerWidth < 640;

        function labelWindowBtn() {
            if (!windowBtn) return;
            const full = document.fullscreenElement || document.webkitFullscreenElement;
            if (full) windowBtn.textContent = narrow() ? 'Exit' : 'Exit full screen';
            else if (coarse || !window.open) windowBtn.textContent = narrow() ? 'Full' : 'Full screen';
            else windowBtn.textContent = narrow() ? 'Window' : 'Play in a window';
        }

        function goFullscreen() {
            const el = document.documentElement;
            const req = el.requestFullscreen || el.webkitRequestFullscreen;
            if (req) req.call(el).catch(() => {});
        }

        function openGameWindow() {
            // Size the popup to the board plus the score strip, capped to the screen.
            const chrome = 150;                                  // score strip + window frame
            const h = Math.min(Math.round((screen.availHeight || 900) * 0.96), 1400);
            const w = Math.min(
                Math.round((h - chrome) * BOARD_ASPECT) + 40,
                Math.round((screen.availWidth || 1200) * 0.9)
            );
            const left = Math.round(((screen.availWidth || 1200) - w) / 2);
            const top = Math.round(((screen.availHeight || 900) - h) / 2);
            const popup = window.open(
                'index.html?mode=window',
                'compliance-man',
                `width=${w},height=${h},left=${left},top=${top},menubar=no,toolbar=no,location=no,status=no,resizable=yes`
            );
            if (!popup) goFullscreen();      // blocked: next best thing
            else popup.focus();
        }

        if (windowBtn) {
            labelWindowBtn();
            windowBtn.addEventListener('click', () => {
                const full = document.fullscreenElement || document.webkitFullscreenElement;
                if (full) {
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                } else if (coarse || isWindowMode || window.opener) {
                    goFullscreen();                 // a phone, or already in its own window
                } else if (!canFullscreen) {
                    openGameWindow();
                } else {
                    openGameWindow();
                }
            });
            ['fullscreenchange', 'webkitfullscreenchange'].forEach(e =>
                document.addEventListener(e, labelWindowBtn));
        }

        // Phaser's FIT scaler needs a nudge when the viewport changes shape
        // (rotation, a resized popup, a phone's address bar sliding away).
        // The board's width comes from the height left to it, so the rows under
        // it are given that same width — otherwise the score strip runs wider
        // than the board it belongs to.
        function syncShellWidth() {
            const wrap = document.querySelector('.board-wrap');
            const shell = document.querySelector('.shell');
            if (!wrap || !shell) return;
            const style = getComputedStyle(wrap);
            const inner = wrap.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
            if (inner <= 0) return;
            const boardWidth = Math.floor(inner * BOARD_ASPECT);
            const gutter = parseFloat(getComputedStyle(shell).paddingLeft) * 2;
            shell.style.maxWidth = Math.min(860, boardWidth + gutter) + 'px';
        }

        let resizeTimer = null;
        const refit = () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                syncShellWidth();
                labelMuteBtn();
                labelWindowBtn();
                if (window.game && window.game.scale) window.game.scale.refresh();
                reportMetrics();
            }, 60);
        };
        requestAnimationFrame(syncShellWidth);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncShellWidth);
        // The board's height settles after fonts and Tailwind land, so follow it
        try {
            const wrapEl = document.querySelector('.board-wrap');
            if (wrapEl && window.ResizeObserver) new ResizeObserver(syncShellWidth).observe(wrapEl);
        } catch (e) { /* older browser: the resize handler covers it */ }
        window.addEventListener('resize', refit);
        window.addEventListener('orientationchange', refit);

        if (isEmbedded) {
            const announce = () => requestAnimationFrame(reportMetrics);
            announce();
            window.addEventListener('resize', announce);
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(announce);
            window.addEventListener('load', announce);
        }

        // ===== BRAND THEME =====
        // Certean: near-black ground, fine diagonal rules, one electric blue
        // accent, everything else black / white / hairline.
        const T = {
            ink: 0x0F141D,
            inkStr: '#0F141D',
            wall: 0x1A2130,          // module blocks
            steel: 0x6B80A0,         // hairlines and quiet labels
            steelStr: '#98A0AE',
            dimStr: '#7A8291',
            labelStr: '#6B80A0',
            dot: 0x8FA5CC,           // every collectible, steel on the board
            dotStr: '#8FA5CC',
            update: 0x7DA3E0,        // the one lit blue
            updateStr: '#7DA3E0',
            accent: 0xFFC53D,        // the gold of the player and every call to action
            accentStr: '#FFC53D',
            hairline: 0xFFFFFF,
            white: 0xFFFFFF,
            whiteStr: '#FFFFFF'
        };
        const CATEGORY_COLORS = {
            standards: T.accentStr,

                    if (this.textures.exists('player')) {

                    ctx.textBaseline = 'middle';
                    ctx.font = face(22);
                    ctx.fillText(mark.code, W / 2, H / 2 - 3);

                    alpha: 1,

                    duration: 500,
                    ease: 'Cubic.easeOut'
                });

                // Tagline
                const tagline = this.add.text(centerX, centerY - 58, 'Comply or pay.', {
                    fontSize: '16px',
                    fontFamily: 'Geist Mono',
                    color: '#B4B8BF'
                }).setOrigin(0.5).setAlpha(0);

                this.tweens.add({
                    targets: tagline,
                    alpha: 1,
                    duration: 400,
                    delay: 300
                });

                // Full-width hairline rule, the way the site separates blocks
                const divider = this.add.rectangle(centerX, centerY - 26, 300, 1, 0xFFFFFF).setAlpha(0);
                this.tweens.add({
                    targets: divider,
                    alpha: 0.12,
                    duration: 400,
                    delay: 500
                });

                // Instructions - clean and simple
                const inst1 = this.add.text(centerX, centerY + 6, 'Collect every requirement, standard and marking.', {
                    fontSize: '14px',
                    fontFamily: 'Geist Mono',
                    color: '#B4B8BF'
                }).setOrigin(0.5).setAlpha(0);

                const inst2 = this.add.text(centerX, centerY + 32, 'Avoid the auditors. Clear updates before they pile up.', {
                    fontSize: '14px',
                    fontFamily: 'Geist Mono',
                    color: '#8A8F98'
                }).setOrigin(0.5).setAlpha(0);

                this.tweens.add({
                    targets: [inst1, inst2],
                    alpha: 1,
                    duration: 400,
                    delay: 600
                });

                // Controls: a label plus a looping animated demo of how to steer
                const touchDevice = isTouchDevice();
                const controls = track(this.add.text(centerX, centerY + 72,
                    touchDevice ? 'SLIDE YOUR THUMB TO STEER' : 'WASD OR ARROW KEYS TO STEER',
                    label(10, T.dimStr)).setOrigin(0.5).setAlpha(0), 2);

                this.tweens.add({
                    targets: controls,
                    alpha: 1,
                    duration: 400,
                    delay: 700
                });

                const demo = this.createControlsDemo(centerX, centerY + 134, touchDevice);
                demo.setAlpha(0);
                this.tweens.add({
                    targets: demo,
                    alpha: 1,
                    duration: 400,
                    delay: 800
                });

                // Start prompt: the site's blue CTA, with a cursor that blinks
                const startLabel = track(this.add.text(centerX, centerY + 212,
                    (touchDevice ? 'TAP TO START' : 'PRESS SPACE TO START') + '   \u2192',
                    label(11, '#141414')).setOrigin(0.5), 2);
                const startBox = this.add.rectangle(centerX, centerY + 212,
                    startLabel.width + 44, 42, T.accent);
                startLabel.setDepth(2);
                const startButton = this.add.container(0, 0, [startBox, startLabel]).setAlpha(0);
                startBox.setInteractive({ useHandCursor: true });

                this.tweens.add({
                    targets: startButton,
                    alpha: 1,
                    duration: 400,
                    delay: 900,
                    onComplete: () => blinkButton(this, startBox)
                });

                // Start game on space or click
                let started = false;
                const startGame = () => {
                    if (started) return;
                    started = true;
                    soundManager.init();
                    soundManager.playStartGame();
                    this.scene.start('GameScene');
                };
                this.input.keyboard.once('keydown-SPACE', startGame);
                startBox.once('pointerdown', startGame);
                this.input.once('pointerdown', startGame);
            }

            // Animated how-to-play strip: on the left the player mirrors each
            // move, on the right either a thumb slides across a pad (touch) or
            // the arrow keys light up (keyboard). Loops until the game starts.
            createControlsDemo(x, y, touch) {
                const c = this.add.container(x, y);
                const DIRS = {
                    up:    { dx: 0,  dy: -1, angle: -90 },
                    right: { dx: 1,  dy: 0,  angle: 0 },
                    down:  { dx: 0,  dy: 1,  angle: 90 },
                    left:  { dx: -1, dy: 0,  angle: 180 }
                };
                const ORDER = ['right', 'down', 'left', 'up'];

                // Left: the player
                const PX = -112;
                const pad = this.add.rectangle(PX, 0, 76, 76, T.wall, 0.75).setStrokeStyle(1, T.hairline, 0.12);
                const player = this.add.image(PX, 0, 'player_1').setDisplaySize(30, 30);
                c.add([pad, player]);

                // Faint guide arrows around the player
                [['up', 0, -28], ['right', 28, 0], ['down', 0, 28], ['left', -28, 0]].forEach(([k, ax, ay]) => {
                    const tri = this.add.triangle(PX + ax, ay, 0, 0, 8, 4, 0, 8, T.white, 0.28).setAngle(DIRS[k].angle);
                    c.add(tri);
                });

                // Right: the input
                const IX = 36;
                const zone = this.add.rectangle(IX, 0, 170, 90, T.wall, 0.75).setStrokeStyle(1, T.hairline, 0.12);
                c.add(zone);

                let playInput;
                if (touch) {
                    const DIST = 38;
                    const ring = this.add.circle(IX, 0, 17).setStrokeStyle(1.5, 0xFFFFFF, 0.4).setAlpha(0);
                    const trail = this.add.rectangle(IX, 0, DIST, 3, T.accent, 0.6).setOrigin(0, 0.5).setAlpha(0);
                    const thumb = this.add.circle(IX, 0, 13, 0xFFFFFF, 0.9).setAlpha(0);
                    const hint = track(this.add.text(IX, 32, 'SLIDE', label(8, T.dimStr)).setOrigin(0.5), 2);
                    c.add([ring, trail, thumb, hint]);

                    playInput = (d, onDone) => {
                        ring.setPosition(IX, 0).setAlpha(0).setScale(0.6);
                        thumb.setPosition(IX, 0).setAlpha(0).setScale(0.8);
                        trail.setPosition(IX, 0).setAngle(d.angle).setScale(0, 1).setAlpha(0);
                        // Touch down
                        this.tweens.add({
                            targets: [ring, thumb], alpha: 1, scale: 1, duration: 180, ease: 'Cubic.easeOut',
                            onComplete: () => {
                                if (!c.scene) return;
                                trail.setAlpha(1);
                                // Slide the thumb, leaving a trail from the anchor
                                this.tweens.add({ targets: thumb, x: IX + d.dx * DIST, y: d.dy * DIST, duration: 320, ease: 'Cubic.easeInOut' });
                                this.tweens.add({
                                    targets: trail, scaleX: 1, duration: 320, ease: 'Cubic.easeInOut',
                                    onComplete: () => {
                                        if (!c.scene) return;
                                        // Lift
                                        this.tweens.add({ targets: [ring, thumb, trail], alpha: 0, duration: 260, delay: 220, onComplete: onDone });
                                    }
                                });
                            }
                        });
                    };
                } else {
                    const K = 24, G = 5;
                    const layout = {
                        up:    [IX, -(K + G) / 2],
                        left:  [IX - (K + G), (K + G) / 2],
                        down:  [IX, (K + G) / 2],
                        right: [IX + (K + G), (K + G) / 2]
                    };
                    const glyph = { up: '\u2191', down: '\u2193', left: '\u2190', right: '\u2192' };
                    const keys = {};
                    Object.keys(layout).forEach(k => {
                        const [kx, ky] = layout[k];
                        const cap = this.add.rectangle(kx, ky, K, K, T.wall, 1).setStrokeStyle(1, T.hairline, 0.2);
                        const glow = this.add.rectangle(kx, ky, K, K, T.accent, 1).setAlpha(0);
                        const glyphText = this.add.text(kx, ky, glyph[k], {
                            fontSize: '13px', fontFamily: 'Geist Mono', color: '#B4B8BF'
                        }).setOrigin(0.5);
                        c.add([cap, glow, glyphText]);
                        keys[k] = { cap, glow, label: glyphText };
                    });

                    playInput = (d, onDone) => {
                        const k = keys[d.key];
                        this.tweens.add({ targets: [k.cap, k.glow, k.label], scale: 0.88, duration: 120, yoyo: true, hold: 420 });
                        this.tweens.add({
                            targets: k.glow, alpha: 1, duration: 120, yoyo: true, hold: 420,
                            onStart: () => k.label.setColor('#FFFFFF'),
                            onComplete: () => { k.label.setColor('#B4B8BF'); onDone(); }
                        });
                    };
                }

                // Sequencer: input on the right, player answers on the left
                let i = 0;
                const step = () => {
                    if (!c.scene) return;
                    const key = ORDER[i++ % ORDER.length];
                    const d = Object.assign({ key }, DIRS[key]);

                    player.setAngle(d.angle).setFlipY(key === 'left');
                    this.tweens.add({
                        targets: player, x: PX + d.dx * 11, y: d.dy * 11,
                        duration: 320, delay: 180, yoyo: true, ease: 'Cubic.easeInOut'
                    });
                    let f = 0;
                    this.time.addEvent({
                        delay: 80, repeat: 6, startAt: 0,
                        callback: () => { if (c.scene) player.setTexture((++f % 2) ? 'player_2' : 'player_1'); }
                    });

                    playInput(d, () => { if (c.scene) this.time.delayedCall(260, step); });
                };
                this.time.delayedCall(900, step);

                return c;
            }
        }

        class GameScene extends Phaser.Scene {
            constructor() {
                super({ key: 'GameScene' });
            }

            init() {
                this.score = 0;
                this.lives = 3;
                this.totalDots = 0;
                this.collectedDots = 0;
                this.initialDots = 0;
                this.collectedInitialDots = 0;
                this.gameOver = false;
                this.invulnerable = false;
                this.currentDirection = null;
                this.inputDirection = null;
                this.touchHeld = null;         // direction while the thumb is down
                this.queuedDirection = null;   // last key press or swipe, consumed by the next turn
                this.swipeOrigin = null;
                this.touchPointerId = null;
                this.validSpawnPositions = [];
                this.openPositions = [];
                this.updateDots = [];
                this.updateNameIndex = Math.floor(Math.random() * UPDATES.length);
                this.activeUpdates = 0; // Counter for active update dots
                this.totalUpdatesAdded = 0; // Total updates spawned this game (max 15)
                // Chomping animation state
                this.chompStep = 0;
                this.chompTimer = 0;
                this.chompInterval = 70; // ms between chomp frames
                // Category counts
                this.counts = {
                    standards: 0,
                    legislations: 0,
                    markings: 0,
                    requirements: 0
                };
            }

            create() {
                fitCamera(this);
                this.physics.world.setBounds(0, 0, BOARD_W, BOARD_H);

                // Start the background music. Anything left over from a win or
                // game-over sting is cut first, so a restart never doubles up.
                soundManager.init();
                if (soundManager.currentTrack !== 'anthem') soundManager.stopJingle();
                soundManager.playAnthem();

                // Reset sidebar counts
                this.updateSidebarCounts();

                // Create maze
                this.createMaze();

                // Create collectibles
                this.createCollectibles();

                // Create player
                this.createPlayer();

                // Create enemies
                this.createEnemies();

                // Create UI
                this.createUI();

                // Setup input
                this.input.keyboard.addCapture('SPACE');
                this.cursors = this.input.keyboard.createCursorKeys();

                // Touch: a floating thumb-stick. Put a thumb down anywhere on
                // the board and slide: the dominant axis of the drag is the
                // direction. The anchor re-centres after every read, so a
                // change of direction mid-slide registers immediately.
                this.touchStick = this.createTouchStick();
                this.input.on('pointerdown', p => {
                    if (this.gameOver) return;
                    if (this.swipeOrigin && p.id !== this.touchPointerId) return; // ignore a second finger
                    this.touchPointerId = p.id;
                    this.swipeOrigin = { x: p.worldX, y: p.worldY };
                    if (p.wasTouch) this.touchStick.show(p.worldX, p.worldY);
                });
                this.input.on('pointermove', p => {
                    if (!p.isDown || !this.swipeOrigin || p.id !== this.touchPointerId) return;
                    this.touchStick.follow(p.worldX, p.worldY);
                    const dx = p.worldX - this.swipeOrigin.x;
                    const dy = p.worldY - this.swipeOrigin.y;
                    if (Math.max(Math.abs(dx), Math.abs(dy)) < TOUCH_DEADZONE) return;
                    const dir = Math.abs(dx) > Math.abs(dy)
                        ? (dx > 0 ? 'right' : 'left')
                        : (dy > 0 ? 'down' : 'up');
                    this.touchHeld = dir;
                    this.queuedDirection = dir;
                    this.swipeOrigin = { x: p.worldX, y: p.worldY };
                    this.touchStick.anchor(p.worldX, p.worldY);
                });
                const release = p => {
                    if (p.id !== this.touchPointerId) return;
                    this.swipeOrigin = null;
                    this.touchPointerId = null;
                    this.touchHeld = null; // the last swipe stays queued until used
                    this.touchStick.hide();
                };
                this.input.on('pointerup', release);
                this.input.on('pointerupoutside', release);
                this.wasd = this.input.keyboard.addKeys({
                    up: Phaser.Input.Keyboard.KeyCodes.W,
                    down: Phaser.Input.Keyboard.KeyCodes.S,
                    left: Phaser.Input.Keyboard.KeyCodes.A,
                    right: Phaser.Input.Keyboard.KeyCodes.D
                });

                // Remember every key press as an event, not by polling, so even
                // a tap shorter than one frame is queued for the next turn
                const KEY_DIRECTIONS = {
                    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
                    KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right'
                };
                this.input.keyboard.on('keydown', event => {
                    const dir = KEY_DIRECTIONS[event.code];
                    if (dir && !this.gameOver) this.queuedDirection = dir;
                });

                // Collisions
                this.physics.add.collider(this.player, this.walls);
                this.physics.add.collider(this.enemies, this.walls);
                this.physics.add.overlap(this.player, this.dots, this.collectDot, null, this);
                this.physics.add.overlap(this.player, this.enemies, this.hitEnemy, null, this);
            }

            // Subtle on-board indicator for thumb steering: a ring at the
            // anchor and a dot under the finger. Only shown for touch input.
            createTouchStick() {
                const ring = this.add.circle(0, 0, 22).setStrokeStyle(1.5, 0xFFFFFF, 0.35).setDepth(30).setVisible(false);
                const dot = this.add.circle(0, 0, 9, 0xFFFFFF, 0.45).setDepth(30).setVisible(false);
                return {
                    show: (x, y) => {
                        ring.setPosition(x, y).setStrokeStyle(1.5, 0xFFFFFF, 0.35).setVisible(true);
                        dot.setPosition(x, y).setVisible(true);
                    },
                    follow: (x, y) => dot.setPosition(x, y),
                    anchor: (x, y) => {
                        if (!ring.visible) return;
                        ring.setPosition(x, y).setStrokeStyle(1.5, T.accent, 0.6);
                    },
                    hide: () => { ring.setVisible(false); dot.setVisible(false); }
                };
            }

            createMaze() {
                // Lined ground first, maze drawn on top
                addStripes(this, -20);
                this.walls = this.physics.add.staticGroup();

                // Every wall tile is its own discrete module, drawn from the
                // dotted-border texture
                for (let y = 0; y < MAZE_HEIGHT; y++) {
                    for (let x = 0; x < MAZE_WIDTH; x++) {
                        if (MAZE[y][x] !== 1) continue;
                        const wall = this.walls.create(
                            x * TILE_SIZE + TILE_SIZE / 2,
                            y * TILE_SIZE + TILE_SIZE / 2,
                            'wall'
                        );
                        // Static bodies do not follow a scale change on their own:
                        // the texture is drawn at device resolution, so the body
                        // has to be rebuilt at the displayed tile size
                        wall.setDisplaySize(TILE_SIZE, TILE_SIZE).setDepth(-10);
                        wall.refreshBody();
                    }
                }
            }

            createCollectibles() {
                this.dots = this.physics.add.group();

                // Markings are not scattered here any more: they appear one at a
                // time, for a few seconds, and are gone again (see spawnMarking).
                const getRandomCategory = () => {
                    const rand = Math.random();
                    if (rand < 0.50) return 'requirements';
                    if (rand < 0.75) return 'standards';
                    return 'legislations';
                };

                const categoryIndices = {
                    standards: 0,
                    legislations: 0,
                    markings: 0,
                    requirements: 0
                };

                for (let y = 0; y < MAZE_HEIGHT; y++) {
                    for (let x = 0; x < MAZE_WIDTH; x++) {
                        // Every open tile that is not the pen can carry a mark,
                        // including the bare corridors the dots never sit on.
                        if (MAZE[y][x] !== 1 && MAZE[y][x] !== 3) {
                            this.openPositions.push({ x, y });
                        }
                        if (MAZE[y][x] === 2) {
                            // Store valid spawn positions for later updates
                            this.validSpawnPositions.push({ x, y });

                            const category = getRandomCategory();
                            const items = COLLECTIBLES[category];
                            const itemIndex = categoryIndices[category] % items.length;
                            categoryIndices[category]++;

                            const textureMap = {
                                standards: 'dot_standard',
                                legislations: 'dot_legislation',
                                requirements: 'dot_requirement'
                            };

                            const dot = this.dots.create(
                                x * TILE_SIZE + TILE_SIZE / 2,
                                y * TILE_SIZE + TILE_SIZE / 2,
                                textureMap[category]
                            );
                            dot.itemName = items[itemIndex];
                            dot.category = category;
                            const dotSize = category === 'requirements' ? 12 : 15;
                            dot.setDisplaySize(dotSize, dotSize);
                            dot.isUpdate = false;
                            this.totalDots++;
                            this.initialDots++;
                        }
                    }
                }

                // Start spawning update dots periodically
                this.time.addEvent({
                    delay: 5000, // Every 5 seconds
                    callback: this.spawnUpdateDot,
                    callbackScope: this,
                    loop: true
                });

                // ...and the marks, which come and go on their own clock
                this.activeMarking = null;
                this.markingLife = null;
                this.scheduleMarking(true);
            }

            scheduleMarking(first) {
                if (this.gameOver) return;
                const delay = first ? 7000 : Phaser.Math.Between(10000, 17000);
                this.markingTimer = this.time.delayedCall(delay, () => this.spawnMarking(), [], this);
            }

            /**
             * A conformity mark surfaces somewhere on the board, stays about ten
             * seconds (blinking out the last two), then is gone. One at a time,
             * worth a detour, and it never counts towards the board's compliance
             * total — only towards your score.
             */
            spawnMarking() {
                if (this.gameOver) return;
                if (this.activeMarking && this.activeMarking.active) { this.scheduleMarking(); return; }

                const occupied = new Set();
                this.dots.getChildren().forEach(d =>
                    occupied.add(Math.floor(d.x / TILE_SIZE) + ',' + Math.floor(d.y / TILE_SIZE)));
                const playerTile = Math.floor(this.player.x / TILE_SIZE) + ',' + Math.floor(this.player.y / TILE_SIZE);
                const free = this.openPositions.filter(pos => {
                    const key = pos.x + ',' + pos.y;
                    return !occupied.has(key) && key !== playerTile;
                });
                if (!free.length) { this.scheduleMarking(); return; }

                const pos = Phaser.Math.RND.pick(free);
                const mark = Phaser.Math.RND.pick(COUNTRY_MARKINGS);
                const dot = this.dots.create(
                    pos.x * TILE_SIZE + TILE_SIZE / 2,
                    pos.y * TILE_SIZE + TILE_SIZE / 2,
                    'mark_' + mark.code
                );
                const plate = this.textures.get('mark_' + mark.code).getSourceImage();
                const iconH = 18;
                dot.setDisplaySize(Math.min(52, Math.round(iconH * plate.width / plate.height)), iconH);
                dot.setDepth(7);
                dot.category = 'markings';
                dot.itemName = mark.code;
                dot.mark = mark;
                dot.isUpdate = false;
                this.activeMarking = dot;
                this.totalDots++;
                this.progressText.setText(this.collectedDots + '/' + this.totalDots);

                this.tweens.add({
                    targets: dot,
                    scaleX: dot.scaleX * 1.14,
                    scaleY: dot.scaleY * 1.14,
                    duration: 560,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.easeInOut'
                });

                const LIFE = 10000;
                this.time.delayedCall(LIFE - 2600, () => {
                    if (!dot.active) return;
                    this.tweens.add({ targets: dot, alpha: 0.2, duration: 210, yoyo: true, repeat: 5 });
                }, [], this);

                this.markingLife = this.time.delayedCall(LIFE, () => {
                    if (dot.active) {
                        this.tweens.killTweensOf(dot);
                        dot.destroy();
                        this.totalDots--;
                        this.progressText.setText(this.collectedDots + '/' + this.totalDots);
                    }
                    this.activeMarking = null;
                    this.scheduleMarking();
                }, [], this);
            }

            /**
             * Taking a country's mark clears its auditor: the flag is sent back
             * to its corner and stands down for a few seconds.
             */
            certifyCountry(countryName) {
                let cleared = null;
                this.enemies.getChildren().forEach(enemy => {
                    if (enemy.flagName !== countryName) return;
                    cleared = enemy;
                    enemy.setPosition(enemy.spawnX, enemy.spawnY);
                    enemy.setVelocity(0);
                    enemy.certifiedUntil = this.time.now + 5000;
                    this.tweens.add({
                        targets: enemy,
                        alpha: 0.25,
                        duration: 280,
                        yoyo: true,
                        repeat: 8,
                        onComplete: () => enemy.setAlpha(1)
                    });
                });
                if (cleared) {
                    this.time.delayedCall(5000, () => {
                        if (!cleared.active) return;
                        cleared.certifiedUntil = 0;
                        cleared.setAlpha(1);
                        this.changeEnemyDirection(cleared);
                    }, [], this);
                }
                return !!cleared;
            }

            spawnUpdateDot() {
                if (this.gameOver) return;
                if (this.totalUpdatesAdded >= 15) return; // Max 15 updates per game

                // Find positions not currently occupied by dots
                const occupiedPositions = new Set();
                this.dots.getChildren().forEach(dot => {
                    const tileX = Math.floor(dot.x / TILE_SIZE);
                    const tileY = Math.floor(dot.y / TILE_SIZE);
                    occupiedPositions.add(`${tileX},${tileY}`);
                });

                const availablePositions = this.validSpawnPositions.filter(pos =>
                    !occupiedPositions.has(`${pos.x},${pos.y}`)
                );

                if (availablePositions.length === 0) return;

                // Pick random position
                const pos = Phaser.Math.RND.pick(availablePositions);

                // Create update dot
                const updateDot = this.dots.create(
                    pos.x * TILE_SIZE + TILE_SIZE / 2,
                    pos.y * TILE_SIZE + TILE_SIZE / 2,
                    'update_dot'
                );
                updateDot.itemName = UPDATES[this.updateNameIndex++ % UPDATES.length];
                updateDot.category = 'update';
                updateDot.setDisplaySize(20, 20);
                updateDot.isUpdate = true;
                this.totalDots++;

                // Add "UPDATE" label above the dot - green theme
                const dotLabel = track(this.add.text(updateDot.x, updateDot.y - 18,
                    updateDot.itemName.toUpperCase(),
                    label(8, T.updateStr)).setOrigin(0.5), 0.8);
                dotLabel.x = Phaser.Math.Clamp(updateDot.x, dotLabel.width / 2 + 3, BOARD_W - dotLabel.width / 2 - 3);
                updateDot.label = dotLabel;

                // Pulsing glow animation for the dot
                this.tweens.add({
                    targets: updateDot,
                    alpha: 0.6,
                    scaleX: 1.3,
                    scaleY: 1.3,
                    duration: 600,
                    ease: 'Sine.easeInOut',
                    yoyo: true,
                    repeat: -1
                });

                // Pulsing animation for the label
                this.tweens.add({
                    targets: dotLabel,
                    alpha: 0.35,
                    duration: 600,
                    ease: 'Sine.easeInOut',
                    yoyo: true,
                    repeat: -1
                });

                // Increment updates counter
                this.activeUpdates++;
                this.totalUpdatesAdded++;
                this.updateUpdatesText();

                // Show alert if too many untaken updates
                this.checkUpdateAlert();
            }

            checkUpdateAlert() {
                if (this.activeUpdates > 5) {
                    if (!this.updateAlert.visible) {
                        // Start countdown
                        this.updateCountdown = 10;
                        this.updateAlertText();
                        this.updateAlert.setVisible(true);
                        soundManager.playAlarm();

                        // Flash animation
                        if (this.alertFlashTween) this.alertFlashTween.stop();
                        this.alertFlashTween = this.tweens.add({
                            targets: this.updateAlert,
                            alpha: 0.3,
                            duration: 300,
                            ease: 'Sine.easeInOut',
                            yoyo: true,
                            repeat: -1
                        });

                        // Start countdown timer
                        if (this.countdownEvent) this.countdownEvent.remove();
                        this.countdownEvent = this.time.addEvent({
                            delay: 1000,
                            callback: this.tickCountdown,
                            callbackScope: this,
                            repeat: 9
                        });
                    }
                } else {
                    this.clearAlert();
                }
            }

            clearAlert() {
                // Stop countdown and hide alert
                if (this.countdownEvent) {
                    this.countdownEvent.remove();
                    this.countdownEvent = null;
                }
                this.updateAlert.setVisible(false);
                this.updateAlert.setAlpha(1);
                if (this.alertFlashTween) {
                    this.alertFlashTween.stop();
                    this.alertFlashTween = null;
                }
                this.updateCountdown = 10;
            }

            updateUpdatesText() {
                this.updatesText.setText(this.activeUpdates + '/5');
                const over = this.activeUpdates > 5;
                this.updatesText.setColor(over ? T.accentStr : '');
                this.updatesText.setBlink(over);
            }

            updateAlertText() {
                this.updateAlert.setText(
                    'TOO MANY UPDATES PENDING (' + this.activeUpdates + '/5)\n' +
                    'COLLECT THEM OR LOSE A PRODUCT IN ' + this.updateCountdown + 'S'
                );
            }

            tickCountdown() {
                if (this.gameOver) return;
                this.updateCountdown--;
                if (this.updateCountdown <= 0) {
                    // Time's up - lose a life
                    this.lives--;
                    this.livesText.setText(String(this.lives));
                    this.cameras.main.flash(180, 255, 255, 255);
                    soundManager.playHit();

                    if (this.lives <= 0) {
                        this.loseGame(null);
                    } else {
                        // Say why the player just got punished
                        this.showTimeoutPenalty();
                        // Reset countdown
                        this.updateCountdown = 10;
                        this.updateAlertText();
                        this.countdownEvent = this.time.addEvent({
                            delay: 1000,
                            callback: this.tickCountdown,
                            callbackScope: this,
                            repeat: 9
                        });
                    }
                } else {
                    this.updateAlertText();
                }
            }

            showTimeoutPenalty() {
                const centerX = BOARD_W / 2;
                const centerY = BOARD_H / 2;

                const msg = track(this.add.text(centerX, centerY - 40,
                    'UPDATES IGNORED — PRODUCT WITHDRAWN\nPRODUCTS REMAINING: ' + this.lives, {
                    fontSize: '12px',
                    fontFamily: 'Geist Mono',
                    fontStyle: '500',
                    color: '#141414',
                    backgroundColor: '#FFFFFF',
                    align: 'center',
                    padding: { x: 16, y: 12 }
                }).setOrigin(0.5).setDepth(30).setScale(0), 1.4);

                this.tweens.add({
                    targets: msg,
                    scale: 1,
                    duration: 200,
                    ease: 'Back.easeOut'
                });
                this.tweens.add({
                    targets: msg,
                    alpha: 0,
                    delay: 2200,
                    duration: 400,
                    onComplete: () => msg.destroy()
                });
            }

            createPlayer() {
                // Find player spawn position
                let spawnX = 9, spawnY = 16;
                for (let y = 0; y < MAZE_HEIGHT; y++) {
                    for (let x = 0; x < MAZE_WIDTH; x++) {
                        if (MAZE[y][x] === 4) {
                            spawnX = x;
                            spawnY = y;
                        }
                    }
                }

                this.player = this.physics.add.sprite(
                    spawnX * TILE_SIZE + TILE_SIZE / 2,
                    spawnY * TILE_SIZE + TILE_SIZE / 2,
                    'player_0'
                );
                this.player.setDisplaySize(26, 26);
                this.player.setDepth(10); // Ensure player renders on top

                this.playerSpawnX = spawnX * TILE_SIZE + TILE_SIZE / 2;
                this.playerSpawnY = spawnY * TILE_SIZE + TILE_SIZE / 2;
                this.playerRotation = 0; // facing right
            }

            createEnemies() {
                this.enemies = this.physics.add.group();

                // Spawn enemies at different corners of the maze on valid path tiles
                const spawnPoints = [
                    { x: 1, y: 1, dir: 'right' },   // Top-left
                    { x: 17, y: 1, dir: 'left' },   // Top-right
                    { x: 1, y: 20, dir: 'right' },  // Bottom-left
                    { x: 17, y: 20, dir: 'left' }   // Bottom-right
                ];

                for (let i = 0; i < 4; i++) {
                    const spawn = spawnPoints[i];
                    const enemy = this.enemies.create(
                        spawn.x * TILE_SIZE + TILE_SIZE / 2,
                        spawn.y * TILE_SIZE + TILE_SIZE / 2,
                        'flag_' + i
                    );
                    enemy.setDisplaySize(28, 28);
                    enemy.flagName = FLAGS[i].name;
                    enemy.direction = spawn.dir;
                    enemy.spawnX = spawn.x * TILE_SIZE + TILE_SIZE / 2;
                    enemy.spawnY = spawn.y * TILE_SIZE + TILE_SIZE / 2;

                    // Gentle wave so the flags feel alive
                    this.tweens.add({
                        targets: enemy,
                        angle: { from: -4, to: 4 },
                        duration: 420 + i * 70,
                        yoyo: true,
                        repeat: -1,
                        ease: 'Sine.easeInOut'
                    });
                }
            }

            createUI() {
                // HUD lives in the page, not the canvas — bind the stat row elements
                const bind = id => {
                    const el = document.getElementById(id);
                    return {
                        setText: t => {
                            if (!el || el.textContent === String(t)) return;
                            el.textContent = t;
                            // restart the animation even if it is already running
                            el.classList.remove('flash');
                            void el.offsetWidth;
                            el.classList.add('flash');
                        },
                        setColor: c => { if (el) el.style.color = c; },
                        setBlink: on => { if (el) el.classList.toggle('blink', !!on); }
                    };
                };
                this.scoreText = bind('score-stat');
                this.livesText = bind('products-stat');
                this.progressText = bind('progress-stat');
                this.updatesText = bind('updates-stat');
                this.complianceText = bind('compliance-stat');

                this.scoreText.setText('0');
                this.livesText.setText(String(this.lives));
                this.progressText.setText('0/' + this.totalDots);
                this.updatesText.setText('0/5');
                this.updatesText.setColor('');
                this.complianceText.setText('0%');

                // Update alert with countdown (hidden by default) - positioned near top of game
                this.updateAlert = track(this.add.text(MAZE_WIDTH * TILE_SIZE / 2, 50, '', {
                    fontSize: '10px',
                    fontFamily: 'Geist Mono',
                    fontStyle: '500',
                    color: '#0A0A0A',
                    backgroundColor: '#FFFFFF',
                    align: 'center',
                    padding: { x: 14, y: 9 }
                }).setOrigin(0.5, 0.5).setDepth(100), 1.4);
                this.updateAlert.setVisible(false);
                this.updateCountdown = 10;
                this.countdownEvent = null;
            }

            update(time, delta) {
                if (this.gameOver) return;

                // Handle input
                this.handleInput();

                // Move player with target-based movement
                this.movePlayer();

                // Animate player chomping and rotation
                this.animatePlayer(delta);

                // Move enemies
                this.moveEnemies();
            }

            animatePlayer(delta) {
                // Update rotation based on direction
                const targetRotations = {
                    'right': 0,
                    'down': Math.PI / 2,
                    'left': Math.PI,
                    'up': -Math.PI / 2
                };

                if (this.currentDirection) {
                    this.playerRotation = targetRotations[this.currentDirection];
                    this.player.setRotation(this.playerRotation);
                    this.player.setFlipY(this.currentDirection === 'left');

                    // Chomping animation while moving: closed, half, open, half
                    this.chompTimer += delta;
                    if (this.chompTimer >= this.chompInterval) {
                        this.chompTimer = 0;
                        this.chompStep = (this.chompStep + 1) % 4;
                        this.player.setTexture('player_' + [0, 1, 2, 1][this.chompStep]);
                    }
                } else {
                    // Rest with mouth closed when not moving
                    if (this.chompStep !== 0) {
                        this.chompStep = 0;
                        this.player.setTexture('player_0');
                    }
                }
            }

            handleInput() {
                // A held key wins, then a held thumb. Every key press or swipe
                // is also remembered until the turn happens, so a quick tap of
                // "up" before a junction still turns the player there.
                let key = null;
                if (this.cursors.left.isDown || this.wasd.left.isDown) key = 'left';
                else if (this.cursors.right.isDown || this.wasd.right.isDown) key = 'right';
                else if (this.cursors.up.isDown || this.wasd.up.isDown) key = 'up';
                else if (this.cursors.down.isDown || this.wasd.down.isDown) key = 'down';

                if (key) this.queuedDirection = key;
                this.inputDirection = key || this.touchHeld || this.queuedDirection;
            }

            movePlayer() {
                // Get current tile position (clamped while crossing the tunnel edges)
                const tileX = Phaser.Math.Clamp(Math.floor(this.player.x / TILE_SIZE), 0, MAZE_WIDTH - 1);
                const tileY = Phaser.Math.Clamp(Math.floor(this.player.y / TILE_SIZE), 0, MAZE_HEIGHT - 1);
                const tileCenterX = tileX * TILE_SIZE + TILE_SIZE / 2;
                const tileCenterY = tileY * TILE_SIZE + TILE_SIZE / 2;

                // Distance to tile center
                const distX = Math.abs(this.player.x - tileCenterX);
                const distY = Math.abs(this.player.y - tileCenterY);

                // More forgiving center detection
                const threshold = 6;
                const nearCenterX = distX < threshold;
