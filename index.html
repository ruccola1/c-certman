                const nearCenterY = distY < threshold;

                // Try to change direction when near center. Only when the
                // request differs from the current heading: otherwise holding a
                // key (or thumb) in the direction of travel would re-snap the
                // player to the tile centre every frame and freeze it in place.
                if (nearCenterX && nearCenterY && this.inputDirection && this.inputDirection !== this.currentDirection) {
                    if (this.canMoveInDirection(tileX, tileY, this.inputDirection)) {
                        // Snap to center when changing direction
                        this.player.x = tileCenterX;
                        this.player.y = tileCenterY;
                        this.currentDirection = this.inputDirection;
                    }
                }

                // One press or swipe = one turn: drop it once we are heading that way
                if (this.queuedDirection && this.queuedDirection === this.currentDirection) {
                    this.queuedDirection = null;
                }

                // Check if current direction is still valid
                if (this.currentDirection && nearCenterX && nearCenterY) {
                    if (!this.canMoveInDirection(tileX, tileY, this.currentDirection)) {
                        this.player.x = tileCenterX;
                        this.player.y = tileCenterY;
                        this.player.setVelocity(0);
                        this.currentDirection = null;
                        return;
                    }
                }

                // Apply velocity based on current direction
                if (this.currentDirection) {
                    switch (this.currentDirection) {
                        case 'left':
                            this.player.setVelocity(-PLAYER_SPEED, 0);
                            break;
                        case 'right':
                            this.player.setVelocity(PLAYER_SPEED, 0);
                            break;
                        case 'up':
                            this.player.setVelocity(0, -PLAYER_SPEED);
                            break;
                        case 'down':
                            this.player.setVelocity(0, PLAYER_SPEED);
                            break;
                    }
                } else {
                    this.player.setVelocity(0);
                }

                // Wrap through the side tunnels
                const worldWidth = MAZE_WIDTH * TILE_SIZE;
                if (this.player.x < -TILE_SIZE / 2) {
                    this.player.x = worldWidth + TILE_SIZE / 2;
                } else if (this.player.x > worldWidth + TILE_SIZE / 2) {
                    this.player.x = -TILE_SIZE / 2;
                }
            }

            canMoveInDirection(tileX, tileY, direction) {
                let checkX = tileX;
                let checkY = tileY;

                switch (direction) {
                    case 'left': checkX--; break;
                    case 'right': checkX++; break;
                    case 'up': checkY--; break;
                    case 'down': checkY++; break;
                }

                // Check vertical bounds
                if (checkY < 0 || checkY >= MAZE_HEIGHT) {
                    return false;
                }

                // Wrap horizontally so tunnel rows connect the left and right edges
                checkX = ((checkX % MAZE_WIDTH) + MAZE_WIDTH) % MAZE_WIDTH;

                // Check if wall
                return MAZE[checkY][checkX] !== 1;
            }

            canMove(sprite, direction) {
                const tileX = Math.floor(sprite.x / TILE_SIZE);
                const tileY = Math.floor(sprite.y / TILE_SIZE);
                return this.canMoveInDirection(tileX, tileY, direction);
            }

            moveEnemies() {
                const speed = ENEMY_SPEED;
                this.enemies.getChildren().forEach(enemy => {
                    // A country whose mark you hold has stood its auditor down
                    if (enemy.certifiedUntil && this.time.now < enemy.certifiedUntil) {
                        enemy.setVelocity(0);
                        return;
                    }

                    // Wrap through the side tunnels
                    const worldWidth = MAZE_WIDTH * TILE_SIZE;
                    if (enemy.x < -TILE_SIZE / 2) {
                        enemy.x = worldWidth + TILE_SIZE / 2;
                    } else if (enemy.x > worldWidth + TILE_SIZE / 2) {
                        enemy.x = -TILE_SIZE / 2;
                    }

                    // Recover if somehow pushed out of vertical bounds
                    if (enemy.y < TILE_SIZE / 2 || enemy.y > MAZE_HEIGHT * TILE_SIZE - TILE_SIZE / 2) {
                        const tileX = Math.max(1, Math.min(MAZE_WIDTH - 2, Math.floor(enemy.x / TILE_SIZE)));
                        const tileY = Math.max(1, Math.min(MAZE_HEIGHT - 2, Math.floor(enemy.y / TILE_SIZE)));
                        enemy.x = tileX * TILE_SIZE + TILE_SIZE / 2;
                        enemy.y = tileY * TILE_SIZE + TILE_SIZE / 2;
                        this.changeEnemyDirection(enemy);
                    }

                    // Check if enemy is stuck (velocity blocked by wall)
                    const isStuck = enemy.body &&
                        Math.abs(enemy.body.velocity.x) < 5 &&
                        Math.abs(enemy.body.velocity.y) < 5;

                    if (isStuck) {
                        // Snap to nearest tile center and change direction
                        const tileX = Math.round((enemy.x - TILE_SIZE / 2) / TILE_SIZE);
                        const tileY = Math.round((enemy.y - TILE_SIZE / 2) / TILE_SIZE);
                        enemy.x = tileX * TILE_SIZE + TILE_SIZE / 2;
                        enemy.y = tileY * TILE_SIZE + TILE_SIZE / 2;
                        this.changeEnemyDirection(enemy);
                    }

                    // Get current tile center
                    const tileX = Math.floor(enemy.x / TILE_SIZE);
                    const tileY = Math.floor(enemy.y / TILE_SIZE);
                    const centerX = tileX * TILE_SIZE + TILE_SIZE / 2;
                    const centerY = tileY * TILE_SIZE + TILE_SIZE / 2;

                    // Check if near tile center (within 4 pixels)
                    const nearCenter = Math.abs(enemy.x - centerX) < 4 && Math.abs(enemy.y - centerY) < 4;

                    if (nearCenter) {
                        // Check if we need to change direction
                        if (!this.canMove(enemy, enemy.direction)) {
                            this.changeEnemyDirection(enemy);
                        } else {
                            // At intersection, maybe change direction
                            const validDirs = ['left', 'right', 'up', 'down'].filter(d => this.canMove(enemy, d));
                            if (validDirs.length > 2 && Math.random() < 0.01) {
                                this.changeEnemyDirection(enemy);
                            }
                        }
                    }

                    // Set velocity based on direction
                    switch (enemy.direction) {
                        case 'left': enemy.setVelocity(-speed, 0); break;
                        case 'right': enemy.setVelocity(speed, 0); break;
                        case 'up': enemy.setVelocity(0, -speed); break;
                        case 'down': enemy.setVelocity(0, speed); break;
                        default: enemy.setVelocity(0, 0);
                    }
                });
            }

            changeEnemyDirection(enemy, forceRandom = false) {
                const directions = ['left', 'right', 'up', 'down'];
                const validDirections = directions.filter(dir => this.canMove(enemy, dir));

                if (validDirections.length === 0) return;

                const opposite = {
                    'left': 'right',
                    'right': 'left',
                    'up': 'down',
                    'down': 'up'
                };

                // Don't go back unless it's the only option
                let candidates = validDirections.filter(dir => dir !== opposite[enemy.direction]);
                if (candidates.length === 0) candidates = validDirections;

                // 50% chance to bias toward player (simple chase behavior)
                if (!forceRandom && Math.random() < 0.5 && this.player) {
                    const dx = this.player.x - enemy.x;
                    const dy = this.player.y - enemy.y;

                    // Score directions by how much they move toward player
                    const scores = candidates.map(dir => {
                        let score = Math.random() * 0.5; // Base randomness
                        if (dir === 'left' && dx < 0) score += 1;
                        if (dir === 'right' && dx > 0) score += 1;
                        if (dir === 'up' && dy < 0) score += 1;
                        if (dir === 'down' && dy > 0) score += 1;
                        return { dir, score };
                    });

                    scores.sort((a, b) => b.score - a.score);
                    enemy.direction = scores[0].dir;
                } else {
                    enemy.direction = Phaser.Math.RND.pick(candidates);
                }
            }

            collectDot(player, dot) {
                // Check if it's an update dot (gives more points)
                const isUpdate = dot.isUpdate;
                const category = dot.category;

                // Points based on category
                const pointsMap = {
                    standards: 20,
                    legislations: 20,
                    markings: 100,     // rare, and the only one worth a detour
                    requirements: 5
                };
                const points = isUpdate ? 50 : (pointsMap[category] || 10);

                // Play appropriate sound effect
                if (isUpdate) {
                    soundManager.playUpdateCollect();
                    this.cameras.main.flash(120, 125, 163, 224);
                    // Decrement updates counter
                    this.activeUpdates--;
                    this.updateUpdatesText();
                    this.checkUpdateAlert();
                } else if (category === 'markings') {
                    // The rare one: it should be unmistakable that you got it.
                    soundManager.playMarking();
                    this.cameras.main.flash(200, 255, 197, 61);
                    this.counts.markings++;
                    this.updateSidebarCounts();
                    const mark = dot.mark || { code: dot.itemName || 'MARK', country: '' };
                    const cleared = mark.country ? this.certifyCountry(mark.country) : false;
                    this.celebrateMarking(dot.x, dot.y, mark, points, cleared);
                    if (this.markingLife) { this.markingLife.remove(false); this.markingLife = null; }
                    this.activeMarking = null;
                    this.scheduleMarking();
                } else {
                    soundManager.playChomp();
                    // Update category count
                    if (category && this.counts[category] !== undefined) {
                        this.counts[category]++;
                        this.updateSidebarCounts();
                    }
                }

                // Destroy label if it's an update dot
                if (dot.label) {
                    dot.label.destroy();
                }

                const dotX = dot.x;
                const dotY = dot.y;
                const itemName = dot.itemName || 'ITEM';

                dot.destroy();
                this.score += points;
                this.scoreText.setText(String(this.score));
                this.collectedDots++;
                this.progressText.setText(this.collectedDots + '/' + this.totalDots);

                // Markings carry their own announcement, and they were never part
                // of the board's starting dots — so compliance does not move.
                if (category === 'markings') return;

                // Show collected item name (shorter for requirements)
                const isReq = category === 'requirements';
                const displayName = isUpdate
                    ? itemName.toUpperCase() + ' +' + points
                    : (isReq ? '+' + points : itemName + ' +' + points);
                const nameText = track(this.add.text(dotX, dotY - 22, displayName, {
                    fontSize: isReq ? '9px' : '11px',
                    fontFamily: 'Geist Mono',
                    fontStyle: '500',
                    color: isUpdate ? '#FFFFFF' : '#0A0A0A',
                    backgroundColor: isUpdate ? T.updateStr : (CATEGORY_COLORS[category] || T.accentStr),
                    padding: { x: 7, y: 5 }
                }).setOrigin(0.5).setDepth(15).setScale(0.6), 1);

                // Keep long names fully on screen near the maze edges
                nameText.x = Phaser.Math.Clamp(dotX, nameText.width / 2 + 4, MAZE_WIDTH * TILE_SIZE - nameText.width / 2 - 4);

                // If the previous label still overlaps this one, replace it so text stays readable
                if (this.lastLabel && this.lastLabel.active) {
                    const overlaps = Math.abs(this.lastLabel.x - nameText.x) < (this.lastLabel.width + nameText.width) / 2 &&
                        Math.abs(this.lastLabel.y - nameText.y) < 24;
                    if (overlaps) {
                        this.tweens.killTweensOf(this.lastLabel);
                        this.lastLabel.destroy();
                    }
                }
                this.lastLabel = nameText;

                // Pop in, drift up, hold, then fade
                this.tweens.add({
                    targets: nameText,
                    scale: 1,
                    duration: 120,
                    ease: 'Back.easeOut'
                });
                this.tweens.add({
                    targets: nameText,
                    y: dotY - 52,
                    duration: 1100,
                    ease: 'Cubic.easeOut'
                });
                this.tweens.add({
                    targets: nameText,
                    alpha: 0,
                    delay: 650,
                    duration: 450,
                    onComplete: () => nameText.destroy()
                });

                this.trackInitialDot(isUpdate);
            }

            // Compliance climbs on every dot that was on the board at the start
            trackInitialDot(isUpdate) {
                if (isUpdate) return;
                this.collectedInitialDots++;
                this.complianceText.setText(
                    Math.round((this.collectedInitialDots / this.initialDots) * 100) + '%'
                );
                if (this.collectedInitialDots >= this.initialDots) {
                    this.winGame();
                }
            }

            /**
             * A marking is the rare prize, so taking one is announced properly:
             * the seal bursts where it stood, the name lands on a gold plate and
             * a banner names it across the top of the board.
             */
            celebrateMarking(x, y, mark, points, cleared) {
                const name = mark.code;
                // Expanding seal ring at the pickup
                const ring = this.add.circle(x, y, 9).setStrokeStyle(2, T.accent, 1).setDepth(17);
                this.tweens.add({
                    targets: ring,
                    radius: 42,
                    alpha: 0,
                    duration: 520,
                    ease: 'Cubic.easeOut',
                    onComplete: () => ring.destroy()
                });

                // Gold plate with the mark's own name
                const plate = track(this.add.text(x, y - 26, name.toUpperCase() + '  +' + points, {
                    fontSize: '14px',
                    fontFamily: 'Geist Mono',
                    fontStyle: '700',
                    color: T.inkStr,
                    backgroundColor: T.accentStr,
                    padding: { x: 10, y: 7 }
                }).setOrigin(0.5).setDepth(18).setScale(0.5), 1.5);
                plate.x = Phaser.Math.Clamp(x, plate.width / 2 + 4, BOARD_W - plate.width / 2 - 4);
                this.tweens.add({ targets: plate, scale: 1, duration: 170, ease: 'Back.easeOut' });
                this.tweens.add({ targets: plate, y: y - 58, duration: 1300, ease: 'Cubic.easeOut' });
                this.tweens.add({
                    targets: plate,
                    alpha: 0,
                    delay: 950,
                    duration: 420,
                    onComplete: () => plate.destroy()
                });

                // Banner across the top so it reads even in the thick of a chase
                if (this.markBanner && this.markBanner.active) {
                    this.tweens.killTweensOf(this.markBanner);
                    this.markBanner.destroy();
                }
                const headline = cleared
                    ? name.toUpperCase() + ' SECURED  \u00b7  ' + mark.country.toUpperCase() + ' CLEARED'
                    : name.toUpperCase() + ' MARKING SECURED';
                const banner = track(this.add.text(BOARD_W / 2, 26, headline, {
                    fontSize: '11px',
                    fontFamily: 'Geist Mono',
                    fontStyle: '600',
                    color: T.accentStr,
                    backgroundColor: 'rgba(15,20,29,0.92)',
                    padding: { x: 12, y: 7 }
                }).setOrigin(0.5).setDepth(18).setAlpha(0), 2);
                this.markBanner = banner;
                this.tweens.add({ targets: banner, alpha: 1, y: 34, duration: 190, ease: 'Back.easeOut' });
                this.tweens.add({
                    targets: banner,
                    alpha: 0,
                    delay: 1250,
                    duration: 400,
                    onComplete: () => banner.destroy()
                });

                // And the stat it belongs to pops
                const markEl = document.getElementById('markings-count');
                if (markEl) {
                    markEl.classList.remove('flash');
                    void markEl.offsetWidth;
                    markEl.classList.add('flash');
                }
            }

            updateSidebarCounts() {
                // Update the HTML sidebar counts
                const stdEl = document.getElementById('standards-count');
                const legEl = document.getElementById('legislations-count');
                const markEl = document.getElementById('markings-count');
                const reqEl = document.getElementById('requirements-count');

                if (stdEl) stdEl.textContent = this.counts.standards;
                if (legEl) legEl.textContent = this.counts.legislations;
                if (markEl) markEl.textContent = this.counts.markings;
                if (reqEl) reqEl.textContent = this.counts.requirements;
            }

            hitEnemy(player, enemy) {
                if (this.gameOver || this.invulnerable) return;
                // Its country's mark is in hand — this one is not auditing anyone
                if (enemy.certifiedUntil && this.time.now < enemy.certifiedUntil) return;
                this.invulnerable = true;

                // Play hit sound
                soundManager.playHit();

                this.lives--;
                this.livesText.setText(String(this.lives));

                // Flash screen
                this.cameras.main.flash(180, 255, 255, 255);

                if (this.lives <= 0) {
                    this.loseGame(enemy);
                } else {
                    // Pause game temporarily
                    this.physics.pause();

                    // Show "Caught by" message
                    const centerX = BOARD_W / 2;
                    const centerY = BOARD_H / 2;

                    const overlay = this.add.rectangle(centerX, centerY,
                        MAZE_WIDTH * TILE_SIZE, MAZE_HEIGHT * TILE_SIZE, T.ink, 0.95).setDepth(20);
                    const overlayLines = addStripes(this, 20.1, 0.9);

                    // Warning text
                    const warningText = track(this.add.text(centerX, centerY - 112,
                        'AUDIT VIOLATION', label(13, T.labelStr)).setOrigin(0.5).setAlpha(0).setDepth(21), 2.4);

                    // Two lines so the headline can be big and still fit the board
                    const caughtText = this.add.text(centerX, centerY - 26,
                        'CAUGHT BY\n' + enemy.flagName.toUpperCase() + ' AUDITORS',
                        Object.assign(display(48), { align: 'center' }))
                        .setOrigin(0.5).setScale(0).setDepth(21);
                    caughtText.setLineSpacing(4);

                    const overlayRule = this.add.rectangle(centerX, centerY + 62, 360, 1, T.hairline, 0.12).setDepth(21);

                    // Lives remaining
                    const livesText = this.add.text(centerX, centerY + 94, 'Products remaining: ' + this.lives, {
                        fontSize: '17px',
                        fontFamily: 'Geist Mono',
                        color: '#8A8F98'
                    }).setOrigin(0.5).setAlpha(0).setDepth(21);

                    // Dramatic scale-in effect
                    this.tweens.add({
                        targets: caughtText,
                        scale: 1,
                        duration: 200,
                        ease: 'Back.easeOut',
                        onComplete: () => {
                            // Shake effect
                            this.tweens.add({
                                targets: caughtText,
                                x: centerX + 3,
                                duration: 50,
                                yoyo: true,
                                repeat: 10,
                                ease: 'Sine.easeInOut',
                                onComplete: () => {
                                    caughtText.setX(centerX);
                                }
                            });
                        }
                    });

                    // Fade in warning and lives text
                    this.tweens.add({
                        targets: [warningText, livesText],
                        alpha: 1,
                        duration: 300,
                        delay: 200
                    });

                    // Screen shake
                    this.cameras.main.shake(300, 0.01);

                    // After 3 seconds, remove message and continue
                    this.time.delayedCall(3000, () => {
                        overlay.destroy();
                        overlayLines.destroy();
                        overlayRule.destroy();
                        caughtText.destroy();
                        warningText.destroy();
                        livesText.destroy();

                        // Reset player position and state
                        this.player.setPosition(this.playerSpawnX, this.playerSpawnY);
                        this.player.setVelocity(0);
                        this.player.setRotation(0);
                        this.player.setTexture('player_0');
                        this.currentDirection = null;
                        this.inputDirection = null;
                        this.touchHeld = null;
                        this.queuedDirection = null;
                        this.touchStick.hide();
                        this.chompStep = 0;
                        this.playerRotation = 0;

                        // Send enemies back to their corners so they can't camp the spawn
                        this.enemies.getChildren().forEach(e => {
                            e.setPosition(e.spawnX, e.spawnY);
                            e.setVelocity(0);
                            this.changeEnemyDirection(e);
                        });

                        // Resume physics
                        this.physics.resume();

                        // Brief invulnerability
                        this.player.setAlpha(0.5);
                        this.time.delayedCall(1500, () => {
                            this.player.setAlpha(1);
                            this.invulnerable = false;
                        });
                    });
                }
            }

            winGame() {
                this.gameOver = true;
                this.player.setVelocity(0);
                this.enemies.getChildren().forEach(e => e.setVelocity(0));
                this.clearAlert();

                // Calculate penalty for remaining updates
                const updatePenalty = this.activeUpdates * 100;
                const finalScore = Math.max(0, this.score - updatePenalty);

                // Win sting, then the victory lap: Offenbach's Can-Can
                soundManager.stopJingle();
                soundManager.playWin();
                this.time.delayedCall(1500, () => {
                    if (this.gameOver) soundManager.playCanCan();
                });

                const centerX = BOARD_W / 2;
                const boardMid = BOARD_H / 2;
                // The panel runs from the kicker (-117) to the foot of the button
                // (+168), so it is centred on the board when lifted by that much.
                const centerY = boardMid - 30;

                // Paper overlay
                const overlay = this.add.rectangle(centerX, boardMid,
                    MAZE_WIDTH * TILE_SIZE, MAZE_HEIGHT * TILE_SIZE, T.ink, 0.96).setDepth(20);
                addStripes(this, 20.1, 0.9);

                this.add.rectangle(centerX - 104, centerY - 112, 8, 8, T.accent).setDepth(21);
                track(this.add.text(centerX - 88, centerY - 112, 'COMPLIANCE 100%',
                    label(13)).setOrigin(0, 0.5).setDepth(21), 2.4);

                const wonText = this.add.text(centerX, centerY - 72, 'COMPLIANCE ACHIEVED',
                    display(30)).setOrigin(0.5).setDepth(21);
                // Arcade flash: hard on/off, not a soft fade
                this.tweens.add({
                    targets: wonText,
                    alpha: 0.15,
                    duration: 110,
                    yoyo: true,
                    repeat: 7,
                    ease: 'Stepped',
                    easeParams: [1]
                });
                this.cameras.main.flash(260, 255, 255, 255);

                this.add.rectangle(centerX, centerY - 38, 360, 1, T.hairline, 0.12).setDepth(21);

                this.add.text(centerX, centerY - 12, 'Score: ' + this.score.toLocaleString('en-US'), {
                    fontSize: '17px',
                    fontFamily: 'Geist Mono',
                    color: '#8A8F98'
                }).setOrigin(0.5).setDepth(21);

                // Show penalty for remaining updates
                if (this.activeUpdates > 0) {
                    this.add.text(centerX, centerY + 16, 'Pending updates: −' + updatePenalty.toLocaleString('en-US'), {
                        fontSize: '17px',
                        fontFamily: 'Geist Mono',
                        color: '#8A8F98'
                    }).setOrigin(0.5).setDepth(21);
                }

                track(this.add.text(centerX, centerY + 100, 'FINAL SCORE',
                    label(12)).setOrigin(0.5).setDepth(21), 2.4);
                this.add.rectangle(centerX, centerY + 86, 360, 1, T.hairline, 0.12).setDepth(21);

                this.add.text(centerX, centerY + 58, finalScore.toLocaleString('en-US'),
                    figure(40)).setOrigin(0.5).setDepth(21);

                const restartLabel = track(this.add.text(centerX, centerY + 156,
                    (isTouchDevice() ? 'TAP TO PLAY AGAIN' : 'PRESS SPACE TO PLAY AGAIN') + '   \u2192',
                    label(13, '#141414')).setOrigin(0.5).setDepth(22), 2);
                const restartBtn = this.add.rectangle(centerX, centerY + 156,
                    restartLabel.width + 48, 46, T.accent).setDepth(21).setInteractive({ useHandCursor: true });
                this.time.delayedCall(600, () => blinkButton(this, restartBtn));

                let restarted = false;
                if (window.reportRound) {
                    window.reportRound('win', finalScore, {
                        compliance: 100,
                        markings: this.counts.markings,
                        collected: this.collectedDots
                    });
                }

                const restart = () => {
                    if (restarted) return;
                    restarted = true;
                    this.scene.restart();
                };
                this.input.keyboard.once('keydown-SPACE', restart);
                restartBtn.once('pointerdown', restart);
                this.time.delayedCall(800, () => {
                    this.input.once('pointerdown', restart);
                });
            }

            loseGame(enemy) {
                this.gameOver = true;
                this.player.setVelocity(0);
                this.enemies.getChildren().forEach(e => e.setVelocity(0));
                this.clearAlert();

                // Stop the music, play sad trombone game over sound
                soundManager.stopJingle();
                soundManager.playGameOver();

                const centerX = BOARD_W / 2;
                const boardMid = BOARD_H / 2;
                // Same balance as the win panel: it runs -148 to +186, so it
                // sits on the board's centre line once lifted by 19.
                const centerY = boardMid - 24;

                // Currency mapping for each market
                const currencies = {
                    'EU': { symbol: '€', code: 'EUR', name: 'Euro' },
                    'US': { symbol: '$', code: 'USD', name: 'US Dollar' },
                    'Brazil': { symbol: 'R$', code: 'BRL', name: 'Brazilian Real' },
                    'S.Korea': { symbol: '₩', code: 'KRW', name: 'South Korean Won' }
                };

                const countryName = enemy ? enemy.flagName : 'Unknown';
                const currency = currencies[countryName] || currencies['US'];

                // Share of required compliance elements actually collected
                const compliancePct = this.initialDots > 0
                    ? Math.round((this.collectedInitialDots / this.initialDots) * 100) : 0;

                // Heavy camera shake
                this.cameras.main.shake(500, 0.02);

                // Overlay with dark theme
                const overlay = this.add.rectangle(centerX, boardMid,
                    MAZE_WIDTH * TILE_SIZE, MAZE_HEIGHT * TILE_SIZE, T.ink, 0.96).setDepth(20);
                addStripes(this, 20.1, 0.9);

                // Non-compliance alert badge - flashing
                const alertBadge = track(this.add.text(centerX, centerY - 142, 'NON-COMPLIANCE',
                    label(13, T.labelStr)).setOrigin(0.5).setAlpha(0).setDepth(21), 2.4);

                // Main audit failed text - starts scaled to 0
                const auditFailedText = this.add.text(centerX, centerY - 96, 'AUDIT FAILED',
                    display(40)).setOrigin(0.5).setScale(0).setDepth(21);

                // Dramatic scale-in with shake
                this.tweens.add({
                    targets: auditFailedText,
                    scale: 1,
                    duration: 300,
                    ease: 'Back.easeOut',
                    onComplete: () => {
                        // Shake effect
                        this.tweens.add({
                            targets: auditFailedText,
                            x: centerX + 4,
                            duration: 40,
                            yoyo: true,
                            repeat: 15,
                            ease: 'Sine.easeInOut',
                            onComplete: () => {
                                auditFailedText.setX(centerX);
                            }
                        });
                    }
                });

                // Flash the alert badge
                this.tweens.add({
                    targets: alertBadge,
                    alpha: 1,
                    duration: 200,
                    delay: 100
                });
                this.tweens.add({
                    targets: alertBadge,
                    alpha: 0.5,
                    duration: 300,
                    yoyo: true,
                    repeat: -1,
                    delay: 500
                });

                // Other elements fade in
                const withdrawnText = this.add.text(centerX, centerY - 50,
                    'Product withdrawn from the ' + (enemy ? countryName : 'US') + ' market at ' + compliancePct + '% compliance', {
                    fontSize: '17px',
                    fontFamily: 'Geist Mono',
                    color: '#8A8F98',
                    align: 'center',
                    wordWrap: { width: 540 }
                }).setOrigin(0.5).setAlpha(0).setDepth(21);

                const dividerLine = this.add.rectangle(centerX, centerY - 14, 360, 1, 0xFFFFFF, 1)
                    .setAlpha(0).setDepth(21);

                const penaltyAmount = { value: 0 };
                // Penalty scales based on uncollected items: 0 if all collected, 2M if none collected
                const uncollectedRatio = this.totalDots > 0 ? (this.totalDots - this.collectedDots) / this.totalDots : 1;
                const targetPenalty = Math.round(2000000 * uncollectedRatio);
                const penaltyLabel = track(this.add.text(centerX, centerY + 18, 'PENALTY',
                    label(12)).setOrigin(0.5).setAlpha(0).setDepth(21), 2.4);

                const penaltyText = this.add.text(centerX, centerY + 52, currency.symbol + '0', {
                    fontSize: '38px',
                    fontFamily: 'Geist Mono',
                    fontStyle: '600',
                    color: '#FFFFFF'
                }).setOrigin(0.5).setAlpha(0).setDepth(21);

                // Spell out the currency so the symbol is unambiguous
                const currencyNote = track(this.add.text(centerX, centerY + 92,
                    currency.name.toUpperCase() + ' (' + currency.code + ')',
                    label(12, T.dimStr)).setOrigin(0.5).setAlpha(0).setDepth(21), 2);

                // Counting animation for penalty
                this.tweens.add({
                    targets: penaltyAmount,
                    value: targetPenalty,
                    duration: 2000,
                    delay: 600,
                    ease: 'Cubic.easeOut',
                    onUpdate: () => {
                        const formatted = Math.floor(penaltyAmount.value).toLocaleString('en-US');
                        penaltyText.setText(currency.symbol + formatted);
                    }
                });

                const scoreText = this.add.text(centerX, centerY + 126, 'Score: ' + this.score.toLocaleString('en-US'), {
                    fontSize: '17px',
                    fontFamily: 'Geist Mono',
                    color: '#8A8F98'
                }).setOrigin(0.5).setAlpha(0).setDepth(21);

                if (window.reportRound) {
                    window.reportRound('lose', this.score, {
                        compliance: compliancePct,
                        markings: this.counts.markings,
                        collected: this.collectedDots
                    });
                }

                const restartLabel = track(this.add.text(centerX, centerY + 174,
                    (isTouchDevice() ? 'TAP TO TRY AGAIN' : 'PRESS SPACE TO TRY AGAIN') + '   \u2192',
                    label(13, '#141414')).setOrigin(0.5).setAlpha(0).setDepth(22), 2);
                const restartText = this.add.rectangle(centerX, centerY + 174,
                    restartLabel.width + 48, 46, T.accent)
                    .setAlpha(0).setDepth(21).setInteractive({ useHandCursor: true });

                // Staggered fade-in for other elements
                this.tweens.add({
                    targets: withdrawnText,
                    alpha: 1,
                    duration: 300,
                    delay: 400
                });
                this.tweens.add({
                    targets: dividerLine,
                    alpha: 0.2,
                    duration: 300,
                    delay: 500
                });
                this.tweens.add({
                    targets: [penaltyLabel, penaltyText, currencyNote],
                    alpha: 1,
                    duration: 300,
                    delay: 600
                });
                this.tweens.add({
                    targets: scoreText,
                    alpha: 1,
                    duration: 300,
                    delay: 800
                });
                this.tweens.add({
                    targets: [restartText, restartLabel],
                    alpha: 1,
                    duration: 300,
                    delay: 1000,
                    onComplete: () => blinkButton(this, restartText)
                });

                let restarted = false;
                const restart = () => {
                    if (restarted) return;
                    restarted = true;
                    this.scene.restart();
                };
                this.input.keyboard.once('keydown-SPACE', restart);
                restartText.once('pointerdown', restart);
                this.time.delayedCall(800, () => {
                    this.input.once('pointerdown', restart);
                });
            }
        }

        // Game configuration
        const config = {
            type: Phaser.AUTO,
            parent: 'game-container',
            backgroundColor: '#0F141D',
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH,
                width: BOARD_W * DPR,
                height: BOARD_H * DPR,
                autoRound: true
            },
            physics: {
                default: 'arcade',
                arcade: {
                    debug: false
                }
            },
            scene: [BootScene, MenuScene, GameScene]
        };

        // Start the game after fonts are loaded
        document.fonts.ready.then(() => {
            window.game = new Phaser.Game(config);
        });
    </script>
</body>
</html>
